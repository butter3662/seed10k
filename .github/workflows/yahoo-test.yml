name: OpenDART 응답 형식 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: |
          code=$(curl -s -m 30 -o /tmp/d -w "%{http_code}" "https://opendart.fss.or.kr/api/list.json?crtfc_key=0000000000000000000000000000000000000000&bgn_de=20261027&end_de=20261027&page_no=1&page_count=100")
          echo "::notice title=OpenDART (가짜 키)::HTTP $code $(head -c 300 /tmp/d)"
