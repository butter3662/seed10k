name: ETF·분할 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          for s in QQQ TQQQ SQQQ SPY 069500.KS 114800.KS NVDA AAPL; do
            curl -s -m 30 -A "Mozilla/5.0" -o /tmp/d "https://query1.finance.yahoo.com/v8/finance/chart/$s?period1=1760918400&period2=1793232000&interval=1d&events=div%7Csplit"
            python3 - "$s" <<'PY'
          import json, sys, datetime
          s = sys.argv[1]
          try:
              r = json.load(open('/tmp/d'))['chart']['result'][0]
              m = r['meta']; ts = r['timestamp']; c = r['indicators']['quote'][0]['close']
              tz = m.get('exchangeTimezoneName'); off = m.get('gmtoffset', 0)
              d = {datetime.datetime.utcfromtimestamp(t + off).strftime('%Y-%m-%d'): v for t, v in zip(ts, c)}
              ev = r.get('events') or {}
              sp = sorted(ev.get('splits', {}).values(), key=lambda x: x['date'])
              spt = [(datetime.datetime.utcfromtimestamp(x['date'] + off).strftime('%Y-%m-%d'), x.get('numerator'), x.get('denominator'), x.get('splitRatio')) for x in sp]
              print(f"::notice title={s}::이름 {m.get('longName') or m.get('shortName')}, 10/23 종가 {d.get('2026-10-23')}, 10/27 {d.get('2026-10-27')}, 분할 {spt}, 배당 {len(ev.get('dividends', {}))}건")
          except Exception as e:
              print(f"::notice title={s}::실패 {e} {open('/tmp/d').read()[:200]}")
          PY
          done
