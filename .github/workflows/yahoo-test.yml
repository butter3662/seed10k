name: 일봉 저가·고가 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: |
          U=https://ictjkqbbcaigdvlysdaw.supabase.co; K=sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux
          curl -s "$U/rest/v1/seed10k_daily?select=id,d,c,l,h&d=gte.2026-10-22&order=d" -H "apikey: $K" -o /tmp/d.json
          python3 - <<'PY'
          import json, collections
          c = collections.Counter()
          for r in json.load(open('/tmp/d.json')):
              c[(r['d'], r['id'][:2], 'lh있음' if r['l'] is not None else 'lh없음')] += 1
          print('::notice title=일봉::' + json.dumps(sorted([list(k) + [v] for k, v in c.items()]), ensure_ascii=False))
          PY
