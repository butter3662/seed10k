name: 한국 시세 표 상태 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: |
          U=https://ictjkqbbcaigdvlysdaw.supabase.co; K=sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux
          curl -s "$U/rest/v1/seed10k_quotes?select=id,p,t,updated_at,i&m=eq.KR" -H "apikey: $K" -o /tmp/q.json
          curl -s -I "$U/rest/v1/seed10k_quotes?select=id" -H "apikey: $K" -H "Prefer: count=exact" | grep -i content-range
          python3 - <<'PY'
          import json, datetime, collections
          kst = lambda s: (datetime.datetime.utcfromtimestamp(s) + datetime.timedelta(hours=9)).strftime('%m-%d %H:%M')
          iso = lambda s: kst(datetime.datetime.fromisoformat(s.replace('Z','+00:00')).timestamp()) if s else '-'
          rows = json.load(open('/tmp/q.json'))
          g = collections.defaultdict(list)
          for r in rows:
              t = (r.get('i') or {}).get('t') or []
              g[(kst(t[-1]) if t else '-', iso(r.get('t')), iso(r.get('updated_at'))[:-1])].append(r['id'][3:])
          print(f"::notice title=행 수::KR {len(rows)}")
          for k, v in sorted(g.items(), key=lambda x: -len(x[1])):
              s = ','.join(v)
              for j in range(0, len(s), 3000):
                  print(f"::notice title=마지막봉 {k[0]} / 최신가시각 {k[1]} / 갱신 {k[2]}x ({len(v)}개)::{s[j:j+3000]}")
          PY
