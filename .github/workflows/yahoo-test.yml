name: 사이트 용량 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/size.py || true
      - run: |
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add probe/size.txt && git commit -m "용량 결과" && git push origin HEAD:tmp-yahoo-test
