name: 페이지 캐시 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: |
          U=https://butter3662.github.io/seed10k/data/prices.json
          curl -s -D /tmp/h1 -o /tmp/b1 "$U"
          E=$(grep -i '^etag' /tmp/h1 | cut -d' ' -f2- | tr -d '\r')
          L=$(grep -i '^last-modified' /tmp/h1 | cut -d' ' -f2- | tr -d '\r')
          C2=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" -H "If-None-Match: $E" "$U")
          C3=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" -H "If-Modified-Since: $L" "$U")
          echo "::notice title=첫 요청::$(head -1 /tmp/h1 | tr -d '\r') 크기 $(wc -c < /tmp/b1) etag $E / cache-control $(grep -i '^cache-control' /tmp/h1 | tr -d '\r') / age $(grep -i '^age' /tmp/h1 | tr -d '\r')"
          echo "::notice title=조건부 요청::If-None-Match → $C2 , If-Modified-Since → $C3"
          S=$(curl -s -o /dev/null -w "%{size_download}" "https://butter3662.github.io/seed10k/data/c/KR_005930.json")
          echo "::notice title=종목 파일 크기::KR_005930 $S"
