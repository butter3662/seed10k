name: 종목 후보 수집 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q finance-datareader yfinance pandas lxml
      - run: python .github/scripts/universe.py
      - run: python .github/scripts/yinfo.py
      - run: |
          mkdir -p tmpdata && mv universe.json yinfo.json tmpdata/
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add tmpdata && git commit -qm "임시: 수집 결과" && git push -q origin HEAD:tmp-yahoo-test
