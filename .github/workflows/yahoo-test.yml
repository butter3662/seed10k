name: 배당 수집 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: 확인
        env:
          U: https://ictjkqbbcaigdvlysdaw.supabase.co
          K: sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux
        run: |
          for i in 1 2 3 4 5 6; do
            c=$(curl -s -m 90 -o /tmp/r -w "%{http_code}" -X POST "$U/functions/v1/seed10k-quotes" -H "apikey: $K" -H "Content-Type: application/json" -d '{}')
            if ! grep -q '방금 실행됨' /tmp/r; then break; fi
            sleep 15
          done
          python3 -c "
          import json; d=json.load(open('/tmp/r')); print('::notice title=함수 응답 HTTP $c::' + json.dumps({k:d.get(k) for k in ('divs','dart','error','skipped')}, ensure_ascii=False)[:600])"
          c2=$(curl -s -m 30 -o /tmp/n -w "%{http_code}" "$U/rest/v1/seed10k_divs?select=id,at,items" -H "apikey: $K")
          python3 - "$c2" <<'PY'
          import json, sys
          try: d = json.load(open('/tmp/n'))
          except Exception: d = None
          if not isinstance(d, list): print(f"::notice title=배당 표::HTTP {sys.argv[1]} {str(d)[:300]}"); sys.exit()
          withd = [r for r in d if r['items']]
          print(f"::notice title=배당 표::HTTP {sys.argv[1]}, {len(d)}종목 저장, 배당 있는 종목 {len(withd)}, 빈 목록 {len([r for r in d if r['items'] == []])}, 실패(null) {len([r for r in d if r['items'] is None])}")
          for r in withd[:4]: print(f"::notice title=예시 {r['id']}::{r['items'][-3:]}")
          PY
