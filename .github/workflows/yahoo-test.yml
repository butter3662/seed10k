name: 한국 5분 봉 날짜 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet yfinance pandas
      - name: 확인
        run: |
          python3 - <<'PY'
          import yfinance as yf, pandas as pd, collections
          df = yf.download(["005930.KS", "000660.KS", "196170.KQ", "AAPL"], group_by="ticker", auto_adjust=False, actions=False, progress=False, threads=True, period="5d", interval="5m")
          for s in ["005930.KS", "000660.KS", "196170.KQ", "AAPL"]:
              c = df[s]["Close"].dropna()
              tz = str(c.index.tz)
              days = collections.Counter(pd.Timestamp(i).strftime("%Y-%m-%d") for i in c.index)
              first = {d: min(pd.Timestamp(i).strftime("%H:%M") for i in c.index if pd.Timestamp(i).strftime("%Y-%m-%d") == d) for d in days}
              print(f"::notice title={s}::tz {tz}, 날짜별 봉 수 {dict(days)}, 첫 봉 시각 {first}")
          PY
