name: 자료 접근 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 probe/p3.py
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add probe/p3.txt && git commit -m "자료 확인 결과" && git push origin HEAD:tmp-yahoo-test
