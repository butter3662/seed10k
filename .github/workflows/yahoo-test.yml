name: 미국 장 점검 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - run: |
          U=https://ictjkqbbcaigdvlysdaw.supabase.co; K=sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux
          curl -s "$U/rest/v1/seed10k_quotes?select=id,p,t,d,updated_at,i&m=eq.US" -H "apikey: $K" -o /tmp/q1.json
          sleep 15
          curl -s "$U/rest/v1/seed10k_quotes?select=id,p,t,d,updated_at&m=eq.US" -H "apikey: $K" -o /tmp/q2.json
          curl -s "$U/rest/v1/seed10k_quotes?select=id,d,updated_at,x:i->x&m=eq.SYS" -H "apikey: $K" -o /tmp/sys.json
          D=$(TZ=America/New_York date +%F)
          curl -s "$U/rest/v1/seed10k_daily?select=id,c,l,h&d=eq.$D&id=like.US*" -H "apikey: $K" -o /tmp/d.json
          for n in $(seq 1 12); do
            curl -s -m 100 -X POST "$U/functions/v1/seed10k-quotes" -H "apikey: $K" -H "Content-Type: application/json" -d '{}' -o /tmp/r.json || true
            grep -q '"wanted"' /tmp/r.json && break
            sleep 6
          done
          python3 - "$D" <<'PY'
          import json, sys, datetime
          D = sys.argv[1]
          q1 = {r['id']: r for r in json.load(open('/tmp/q1.json'))}; q2 = {r['id']: r for r in json.load(open('/tmp/q2.json'))}
          today = [r for r in q1.values() if r['d'] == D]
          moved = [k for k in q1 if q1[k]['t'] != q2.get(k, {}).get('t')]
          withLH = [r for r in today if r['i'] and r['i'].get('l') and len(r['i']['l']) == len(r['i']['t'])]
          print(f"::notice title=미국 시세 ({D})::행 {len(q1)}, 오늘 시세 {len(today)}, 5분 봉 l/h 있음 {len(withLH)}, 15초 사이 체결 시각이 바뀐 종목 {len(moved)}")
          for k in ('US:VG', 'US:SYK', 'US:NVDA', 'US:QQQ'):
              r = q1.get(k) or {}; i = r.get('i') or {}
              print(f"::notice title={k}::p {r.get('p')} t {r.get('t')} → {q2.get(k,{}).get('t')} d {r.get('d')} updated_at {r.get('updated_at')} 봉 {len(i.get('t') or [])} l {bool(i.get('l'))} h {bool(i.get('h'))}")
          sysr = json.load(open('/tmp/sys.json'))
          print("::notice title=표시 줄::" + json.dumps([{k: (v if k != 'x' else (len(v['ids']) if v else None)) for k, v in r.items()} for r in sysr], ensure_ascii=False)[:1500])
          d = json.load(open('/tmp/d.json'))
          print(f"::notice title=일별 표 오늘 미국::행 {len(d)}, l/h 채워짐 {sum(1 for r in d if r['l'] is not None and r['h'] is not None)}")
          r = json.load(open('/tmp/r.json'))
          print("::notice title=함수 응답::" + json.dumps({k: r.get(k) for k in ('act', 'live', 'wanted', 'saved', 'failedCount', 'failed', 'ms', 'skipped', 'error')}, ensure_ascii=False)[:1500])
          PY
