name: 한국 7초 갱신 추적 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/trace.py || true
      - run: |
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add probe/trace.txt && git commit -m "추적 결과" && git push origin HEAD:tmp-yahoo-test
