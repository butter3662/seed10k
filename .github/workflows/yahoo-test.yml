name: 응답 압축 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: |
          U=https://ictjkqbbcaigdvlysdaw.supabase.co; K=sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux
          Q="$U/rest/v1/seed10k_quotes?select=id,m,p,t,d,updated_at"
          A=$(curl -s -o /tmp/a -w "%{size_download}" "$Q" -H "apikey: $K")
          B=$(curl -s -o /tmp/b -D /tmp/hb -w "%{size_download}" "$Q" -H "apikey: $K" -H "Accept-Encoding: gzip, br")
          echo "::notice title=시세 표 전체::압축 요청 안 함 ${A}B / gzip·br 요청 ${B}B / 응답 헤더 $(grep -i 'content-encoding' /tmp/hb | tr -d '\r') / 줄 수 $(python3 -c "import json;print(len(json.load(open('/tmp/a'))))")"
          Q2="$U/rest/v1/seed10k_daily?select=id,d,c,l,h&d=gt.2026-10-23"
          C=$(curl -s -o /tmp/c -w "%{size_download}" "$Q2" -H "apikey: $K")
          D=$(curl -s -o /dev/null -D /tmp/hd -w "%{size_download}" "$Q2" -H "apikey: $K" -H "Accept-Encoding: gzip")
          echo "::notice title=일별 표::압축 안 함 ${C}B / gzip ${D}B $(grep -i 'content-encoding' /tmp/hd | tr -d '\r')"
