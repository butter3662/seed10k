name: 한 줄 불러오기 함수 시험 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: 시험
        run: |
          for f in raw jsd; do
            (deno run -A loadertest/$f.ts > /tmp/$f.log 2>&1 &) ; sleep 12
            out=$(curl -s -m 10 -X POST localhost:8000 -d '{}' || true)
            echo "::notice title=$f::응답 $out / 로그 $(head -c 300 /tmp/$f.log | tr '\n' ' ')"
            pkill -f "loadertest/$f.ts" || true; sleep 2
          done
