name: 거래량 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: |
          for s in KR_005930 US_AAPL; do
            curl -s -m 30 "https://butter3662.github.io/seed10k/data/c/$s.json?t=$(date +%s)" -o /tmp/c.json
            python3 -c "
          import json; d=json.load(open('/tmp/c.json'))['d1']; v=d.get('v')
          print('::notice title=$s::종가 %d개, 거래량 %s, 마지막 3일 %s' % (len(d['c']), (len(v) if v else '없음'), list(zip(d['c'][-3:], (v or [None]*3)[-3:]))))"
          done
