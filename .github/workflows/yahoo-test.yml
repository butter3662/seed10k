name: 종목 후보 수집 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q finance-datareader yfinance pandas lxml
      - run: python .github/scripts/universe.py
      - run: python .github/scripts/yinfo.py
      - uses: actions/upload-artifact@v4
        with: { name: universe, path: "*.json" }
