name: OpenDART TLS 조사 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: 조사
        run: |
          sudo apt-get install -y -qq nmap >/dev/null 2>&1 || true
          nmap --script ssl-enum-ciphers -p 443 opendart.fss.or.kr > /tmp/n 2>&1
          echo "::notice title=암호 목록::$(grep -E 'TLSv|TLS_|compressors|least strength' /tmp/n | tr -s ' ' | tr '\n' ' ' | head -c 1500)"
          c=$(curl -s -m 20 -o /tmp/h -w "%{http_code} %{redirect_url}" "http://opendart.fss.or.kr/api/list.json?crtfc_key=0000000000000000000000000000000000000000&page_count=1")
          echo "::notice title=http 접속::$c $(head -c 200 /tmp/h)"
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1
          echo 'try { const r = await fetch("https://opendart.fss.or.kr/api/list.json?crtfc_key=0&page_count=1"); console.log("ok", r.status, (await r.text()).slice(0,120)); } catch (e) { console.log("err", String(e).replace(/crtfc_key=[^&]*/,"***").slice(0,300)); }' > /tmp/t.ts
          echo "::notice title=Deno $(~/.deno/bin/deno --version | head -1)::$(~/.deno/bin/deno run -A /tmp/t.ts 2>&1 | tr '\n' ' ')"
