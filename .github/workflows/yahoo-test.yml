name: 네이버 채우기 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: |
          U=https://ictjkqbbcaigdvlysdaw.supabase.co; K=sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux
          curl -s "$U/rest/v1/seed10k_quotes?select=id,p,d,i&m=eq.KR" -H "apikey: $K" -o /tmp/q.json
          curl -s "$U/rest/v1/seed10k_daily?select=id,c,l,h&d=eq.2026-10-27&id=in.(KR:005930,KR:000660)" -H "apikey: $K" -o /tmp/d.json
          python3 - <<'PY'
          import json, datetime, collections
          kst = lambda s: (datetime.datetime.utcfromtimestamp(s) + datetime.timedelta(hours=9)).strftime('%H:%M')
          rows = json.load(open('/tmp/q.json')); c = collections.Counter(); bad = []
          for r in rows:
              i = r['i'] or {}
              k = 'nv' if i.get('nv') else (f"nf{i.get('nf')}" if i.get('nf') else '안 함')
              c[k] += 1
              if i.get('nf'): bad.append(r['id'])
          print(f"::notice title=상태::{dict(c)} 실패 {bad[:20]}")
          for r in rows:
              if r['id'] in ('KR:005930', 'KR:000660', 'KR:036930'):
                  i = r['i']; print(f"::notice title={r['id']}::{[(kst(a), b) for a, b in zip(i['t'][-8:], i['c'][-8:])]} 종가 {r['p']}")
          print(f"::notice title=일봉::{open('/tmp/d.json').read()}")
          PY
