name: 한국 장 마감 봉 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: |
          U=https://ictjkqbbcaigdvlysdaw.supabase.co; K=sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux
          curl -s "$U/rest/v1/seed10k_quotes?select=id,p,t,i&id=in.(KR:005930,KR:000660)" -H "apikey: $K" -o /tmp/q.json
          curl -s -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/005930.KS?range=1d&interval=5m" -o /tmp/y.json
          curl -s -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/005930.KS?range=1d&interval=1m" -o /tmp/y1.json
          python3 - <<'PY'
          import json, datetime
          kst = lambda s: (datetime.datetime.utcfromtimestamp(s) + datetime.timedelta(hours=9)).strftime('%H:%M')
          for r in json.load(open('/tmp/q.json')):
              t = r['i']['t']; c = r['i']['c']
              print(f"::notice title=저장된 {r['id']}::봉 {len(t)}개, 첫 {kst(t[0])}, 마지막 5개 {[(kst(a), b) for a, b in zip(t[-5:], c[-5:])]}, 최신가 {r['p']} ({r['t']})")
          for f, lab in (('/tmp/y.json', '5m'), ('/tmp/y1.json', '1m')):
              y = json.load(open(f))['chart']['result'][0]; t = y['timestamp']; c = y['indicators']['quote'][0]['close']; m = y['meta']
              print(f"::notice title=야후 {lab}::봉 {len(t)}개, 마지막 6개 {[(kst(a), b) for a, b in zip(t[-6:], c[-6:])]}, regularMarketPrice {m.get('regularMarketPrice')} 시각 {kst(m.get('regularMarketTime'))}, 거래시간 {m.get('currentTradingPeriod', {}).get('regular')}")
          PY
