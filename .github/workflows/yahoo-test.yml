name: 뉴스 시험 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: timeout 120 deno run -A supabase/functions/seed10k-quotes/news_test.ts
