name: ETF 데이터 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: |
          B=https://butter3662.github.io/seed10k
          curl -s -m 60 "$B/data/prices.json?t=$(date +%s)" -o /tmp/p.json
          python3 - <<'PY'
          import json
          p = json.load(open('/tmp/p.json')); s = p.get('s', {})
          print(f"::notice title=prices.json::종목 {len(s)}, 빠진 종목 {p.get('miss')}")
          for k in ['US:QQQ','US:TQQQ','US:SQQQ','US:SPY','KR:069500','KR:114800','US:VG']:
              print(f"::notice title={k}::{(s.get(k) or [])[-3:]}")
          PY
          for c in US_SQQQ KR_114800; do
            curl -s -m 30 -o /tmp/c.json "$B/data/c/$c.json?t=$(date +%s)"
            echo "::notice title=차트 $c::$(python3 -c "import json; d=json.load(open('/tmp/c.json')); print('d1', len((d.get('d1') or {}).get('c', [])), 'i5', len((d.get('i5') or {}).get('c', [])), 'i5 저가', bool((d.get('i5') or {}).get('l')))")"
          done
          curl -s -m 30 "$B/index.html?t=$(date +%s)" | grep -o "const VERSION = '[0-9.]*'" | head -1 | sed 's/^/::notice title=배포 버전::/'
