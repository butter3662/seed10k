name: Supabase 함수 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 확인
        env:
          U: https://ictjkqbbcaigdvlysdaw.supabase.co
          K: sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux
        run: |
          r() { curl -s -m 20 -o /tmp/b -w "%{http_code} %{time_total}s" "$@" || true; }
          c=$(r -X POST "$U/functions/v1/no-such-function-xyz" -H "apikey: $K" -H "Content-Type: application/json" -d '{}'); echo "::notice title=A 없는 함수::$c $(head -c 200 /tmp/b)"
          c=$(r -X POST "$U/functions/v1/seed10k-quotes" -H "apikey: $K" -H "Content-Type: application/json" -d '{}'); echo "::notice title=B seed10k-quotes::$c $(head -c 200 /tmp/b)"
