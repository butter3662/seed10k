name: yfinance 날짜 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet yfinance pandas
      - name: 확인
        run: |
          python3 - <<'PY'
          import yfinance as yf, datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          for label, kw in [("start만", dict(start="2026-10-23")), ("start+end(+2일)", dict(start="2026-10-23", end=(now + dt.timedelta(days=2)).strftime("%Y-%m-%d"))), ("period 10d", dict(period="10d"))]:
              df = yf.download(["AAPL", "NVDA", "005930.KS", "KRW=X"], group_by="ticker", auto_adjust=False, actions=False, progress=False, threads=True, interval="1d", **kw)
              out = []
              for s in ["AAPL", "NVDA", "005930.KS", "KRW=X"]:
                  try:
                      c = df[s]["Close"].dropna()
                      out.append(f"{s}: {[ (i.strftime('%m-%d'), round(float(v),2)) for i, v in c.tail(3).items()]}")
                  except Exception as e: out.append(f"{s}: ERR {e}")
              print(f"::notice title={label} (yfinance {yf.__version__}, now {now:%m-%d %H:%M}Z)::" + " | ".join(out))
          PY
