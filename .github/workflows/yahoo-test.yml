name: 배포본 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: |
          curl -s -m 30 "https://butter3662.github.io/seed10k/data/prices.json?t=$(date +%s)" -o /tmp/p
          python3 -c "
          import json; d=json.load(open('/tmp/p')); s=d['s']
          print('::notice title=배포본::updated', d['updated'], 'US', d['dates']['US'], 'KR', d['dates']['KR'], 'AAPL', s['US:AAPL'], 'NVDA', s['US:NVDA'], 'TSLA', s['US:TSLA'], '삼성', s['KR:005930'])"
