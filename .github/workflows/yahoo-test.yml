name: 한국 장 종합 점검 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python3 probe/full.py || true
      - run: |
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add probe/full.txt && git commit -m "점검 결과" && git push origin HEAD:tmp-yahoo-test
