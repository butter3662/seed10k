name: 실시간 수집 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 확인
        env:
          U: https://ictjkqbbcaigdvlysdaw.supabase.co
          K: sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux
        run: |
          curl -s -m 30 "$U/rest/v1/seed10k_quotes?select=id,m,p,t,d,updated_at&order=id" -H "apikey: $K" -o /tmp/q
          python3 - <<'PY'
          import json, datetime as dt
          d = json.load(open('/tmp/q'))
          now = dt.datetime.now(dt.timezone.utc)
          P = lambda s: dt.datetime.fromisoformat(s.replace('Z', '+00:00')) if s else None
          sysr = {r['id']: r['updated_at'] for r in d if r['m'] == 'SYS'}
          kr = [r for r in d if r['m'] == 'KR' and r['p'] is not None]
          fx = [r for r in d if r['m'] == 'FX']
          ages = sorted((now - P(r['updated_at'])).total_seconds() for r in kr if r['updated_at'])
          s = next((r for r in kr if r['id'] == 'KR:005930'), None)
          print(f"::notice title=시세 표::지금 {now:%H:%M:%S}Z, SYS {sysr}, KR 값 {len(kr)}/100, KR 갱신 나이(초) 최소 {ages[0] if ages else '-'} 최대 {ages[-1] if ages else '-'}, 삼성전자 {s and (s['p'], s['t'], s['d'])}, FX {fx and (fx[0]['p'], fx[0]['t'])}")
          PY
          curl -s -m 30 "$U/rest/v1/seed10k_daily?select=id,d,c&order=d.desc&limit=3" -H "apikey: $K" -o /tmp/d
          curl -s -m 30 "$U/rest/v1/seed10k_daily?select=id" -H "apikey: $K" -H "Prefer: count=exact" -H "Range: 0-0" -D /tmp/h -o /dev/null
          echo "::notice title=일별 표::$(grep -i content-range /tmp/h | tr -d '\r') $(head -c 200 /tmp/d)"
