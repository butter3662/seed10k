name: 한국 300종목 수집 점검 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/kr300.py || true
      - run: |
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add probe/kr300.txt && git commit -m "점검 결과" && git push origin HEAD:tmp-yahoo-test
