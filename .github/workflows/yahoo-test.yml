name: 아이콘 확인 (임시)
on:
  push:
    branches: [tmp-yahoo-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://butter3662.github.io/seed10k
          { for f in icons/apple-touch-icon.png icons/icon-192.png; do echo "$f $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B' $B/$f)"; done
            curl -s $B/ | grep -o '<link rel="apple-touch-icon"[^>]*>\|apple-mobile-web-app-title[^>]*>\|const VERSION = .[0-9.]*.' ; } > probe/icon.txt
          git config user.name gha; git config user.email gha@users.noreply.github.com
          git add probe/icon.txt && git commit -m "아이콘 결과" && git push origin HEAD:tmp-yahoo-test
