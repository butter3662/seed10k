name: 시세 수집과 배포

# 저장소에 필요한 파일은 index.html, 이 파일, 아이콘 폴더(icons/)다.
# Settings → Pages → Source 를 "GitHub Actions" 로 바꾼 뒤 Actions 탭에서 한 번 실행하면 된다.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 시간은 모두 UTC 기준이다.
    - cron: '*/5 0-6 * * 1-5'    # 한국 정규장 (한국 시각 09:00~15:55)
    - cron: '*/5 13-21 * * 1-5'  # 미국 정규장 (한국 시각 22:00~06:55, 서머타임과 평시 모두)
    - cron: '17 7,22 * * 1-5'    # 장 마감 뒤 최종 종가와 장기 차트 갱신
    - cron: '7 12,13,15 * * 6'   # 로또 추첨 결과 (한국 시각 토 21:07·22:07·24:07)
    - cron: '7 0,6 * * 0'        # 로또 추첨 결과 다시 확인 (한국 시각 일 09:07·15:07)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install --quiet yfinance pandas

      - name: 직전 배포본 받기 (못 받은 종목 채우기, 장기 차트 재사용)
        run: |
          mkdir -p prev
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/prices.json" -o prev/prices.json || echo "직전 prices.json 없음"
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/hist.json" -o prev/hist.json || echo "직전 hist.json 없음"
          for f in rates lotto housing; do curl -fsSL "${{ steps.pages.outputs.base_url }}/data/$f.json" -o prev/$f.json || echo "직전 $f.json 없음"; done

      - name: 시세 수집 스크립트 만들기
        run: |
          cat > fetch_prices.py <<'PY'
          """SEED 10K 실제 시세 수집 스크립트 (GitHub Actions 안에서 실행된다).

          만드는 파일
            data/prices.json      2026-10-23부터의 일별 종가 + 장중 최신가, 원/달러 환율 (게임 전체가 1분마다 읽는다)
            data/c/<종목>.json     종목 상세 차트용: 5분 봉(5거래일), 1시간 봉(1개월), 일봉(2년, 거래량 포함), 주봉(10년), 월봉(전체)
            data/hist.json        일·주·월봉 묶음. 하루 한 번만 새로 받고, 나머지 실행에서는 직전 배포본을 재사용한다.

          날짜는 1970-01-01부터의 일수(정수), 장중 시각은 유닉스 초(정수)로 저장해 파일 크기를 줄인다.
          인자: --out _site/data --prev prev   (prev 폴더에 직전 prices.json, hist.json 이 있으면 사용)
          """
          import argparse
          import datetime as dt
          import json
          import math
          import os
          import pathlib
          import re
          import sys
          import time

          import pandas as pd
          import yfinance as yf

          START = "2026-10-23"
          FX_SYMBOL = "KRW=X"  # 1달러당 원

          _html = pathlib.Path("index.html").read_text(encoding="utf-8")
          _data = json.loads(re.search(r"const DATA = (\{.*?\});\n", _html, re.S).group(1))
          SYMBOLS = {}
          for _s in _data["kr"]:
              SYMBOLS[_s["id"]] = {"y": _s["t"] + (".KQ" if _s["x"] == "KOSDAQ" else ".KS"), "m": "KR"}
          for _s in _data["us"]:
              SYMBOLS[_s["id"]] = {"y": _s["t"], "m": "US"}
          EPOCH = dt.date(1970, 1, 1)
          EXCH_TZ = {"KR": "Asia/Seoul", "US": "America/New_York"}


          def is_weekday(d):
              return dt.date.fromisoformat(d).weekday() < 5


          def drop_weekends(dates, rows):
              """토·일요일 날짜는 거래일이 아니므로 뺀다 (시간대 착오로 끼어든 날짜 정리)."""
              keep = [k for k, d in enumerate(dates) if is_weekday(d)]
              if len(keep) == len(dates):
                  return dates, rows
              print(f"주말 날짜 제거: {[d for d in dates if not is_weekday(d)]}")
              return [dates[k] for k in keep], {sid: [vals[k] for k in keep] for sid, vals in rows.items()}


          def download(symbols, tries=3, vols=None, lows=None, highs=None, **kw):
              """여러 종목을 한 번에 받아 {야후심볼: 종가 Series} 로 돌려준다.
              vols에 dict를 넘기면 같은 요청의 거래량도 {야후심볼: 거래량 Series}로 채운다 (요청을 늘리지 않는다)."""
              out = {}
              pending = list(symbols)
              for attempt in range(tries):
                  if not pending:
                      break
                  try:
                      df = yf.download(pending, group_by="ticker", auto_adjust=False, actions=False,
                                       progress=False, threads=True, timeout=30, **kw)
                  except Exception as e:
                      print(f"download error {kw} (try {attempt + 1}): {e}", file=sys.stderr)
                      time.sleep(5)
                      continue
                  for sym in pending:
                      try:
                          col = df[sym]["Close"] if isinstance(df.columns, pd.MultiIndex) else df["Close"]
                      except KeyError:
                          continue
                      col = col.dropna()
                      if len(col):
                          out[sym] = col
                          for dst, field in ((vols, "Volume"), (lows, "Low"), (highs, "High")):
                              if dst is None:
                                  continue
                              try:
                                  dst[sym] = df[sym][field] if isinstance(df.columns, pd.MultiIndex) else df[field]
                              except KeyError:
                                  pass
                  pending = [s for s in pending if s not in out]
                  if pending:
                      time.sleep(3)
              return out


          def to_date(idx):
              return pd.Timestamp(idx).strftime("%Y-%m-%d")


          def day_num(idx):
              return (pd.Timestamp(idx).date() - EPOCH).days


          def rnd(m, v):
              return round(float(v)) if m == "KR" else round(float(v), 2)


          def series_days(m, s, vol=None):
              s = s[~s.index.duplicated(keep="last")]
              out = {"d": [day_num(i) for i in s.index], "c": [rnd(m, v) for v in s.values]}
              if vol is not None:
                  # 종가와 같은 날짜에 맞춘 거래량(주). 값이 없는 날은 0
                  v = vol[~vol.index.duplicated(keep="last")].reindex(s.index).fillna(0)
                  out["v"] = [int(round(float(x))) for x in v.values]
              return out


          def series_secs(m, s, lo=None, hi=None):
              s = s[~s.index.duplicated(keep="last")]
              out = {"t": [int(pd.Timestamp(i).timestamp()) for i in s.index], "c": [rnd(m, v) for v in s.values]}
              if lo is not None and hi is not None:
                  # 봉의 저가·고가 (예약 주문 판정용). 값이 없으면 종가로 채운다
                  l = lo[~lo.index.duplicated(keep="last")].reindex(s.index)
                  h = hi[~hi.index.duplicated(keep="last")].reindex(s.index)
                  out["l"] = [rnd(m, min(a, c) if a == a else c) for a, c in zip(l.values, s.values)]
                  out["h"] = [rnd(m, max(b, c) if b == b else c) for b, c in zip(h.values, s.values)]
              return out


          def build_market(m, series_by_id):
              """시장(KR/US)별 거래일 목록과 종목별 종가 배열 (prices.json 용)."""
              counts = {}
              for s in series_by_id.values():
                  for d in s.index:
                      k = to_date(d)
                      counts[k] = counts.get(k, 0) + 1
              n = max(1, len(series_by_id))
              dates = sorted(d for d, c in counts.items() if c >= 0.3 * n)
              rows = {}
              for sid, s in series_by_id.items():
                  s = s.copy()
                  s.index = [to_date(d) for d in s.index]
                  s = s[~s.index.duplicated(keep="last")]
                  vals, lastv = [], None
                  for d in dates:
                      v = s.get(d)
                      if v is not None and not (isinstance(v, float) and math.isnan(v)):
                          lastv = float(v)
                      vals.append(None if lastv is None else rnd(m, lastv))
                  rows[sid] = vals
              return dates, rows


          def load_json(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return None


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--out", required=True)
              ap.add_argument("--prev", default="prev")
              a = ap.parse_args()
              out = pathlib.Path(a.out)
              (out / "c").mkdir(parents=True, exist_ok=True)
              prev = load_json(pathlib.Path(a.prev) / "prices.json")
              prev_hist = load_json(pathlib.Path(a.prev) / "hist.json")

              ysyms = [v["y"] for v in SYMBOLS.values()]
              by_y = {v["y"]: sid for sid, v in SYMBOLS.items()}
              now = dt.datetime.now(dt.timezone.utc)

              # ── 1) 게임용 일별 종가 (기준일부터) ──
              got = download(ysyms + [FX_SYMBOL], start=START, interval="1d")
              # 장중 5분 봉 (최근 5거래일). 차트에도 쓰고, Yahoo 일봉에 빠진 거래일을 채우는 데도 쓴다.
              i5l, i5h = {}, {}
              i5 = download(ysyms, period="5d", interval="5m", lows=i5l, highs=i5h)
              result = {"v": 1, "updated": now.strftime("%Y-%m-%dT%H:%M:%SZ"), "start": START, "dates": {}, "s": {}, "miss": []}
              filled_days = {}
              for m in ("KR", "US"):
                  series = {}
                  for sid, v in SYMBOLS.items():
                      if v["m"] != m or v["y"] not in got:
                          continue
                      d1 = got[v["y"]].copy()
                      d1.index = [to_date(i) for i in d1.index]
                      d1 = d1[~d1.index.duplicated(keep="last")]
                      # Yahoo 일봉에 그날이 빠져 있으면 5분 봉의 그날 마지막 가격으로 채운다 (2026-10-27 미국 10/26 누락 사례)
                      if v["y"] in i5:
                          intra = i5[v["y"]]
                          # 여러 거래소 종목을 한꺼번에 받으면 yfinance가 시각을 한 시간대로 맞춘다.
                          # 날짜는 반드시 그 종목 거래소의 현지 시각으로 따진다.
                          idx = pd.DatetimeIndex(intra.index)
                          idx = (idx.tz_convert(EXCH_TZ[m]) if idx.tz is not None else idx.tz_localize("UTC").tz_convert(EXCH_TZ[m]))
                          last_by_day = {}
                          for i, val in zip(idx, intra.values):
                              if i.weekday() < 5:
                                  last_by_day[i.strftime("%Y-%m-%d")] = float(val)
                          add = {d: c for d, c in last_by_day.items() if d >= START and d not in d1.index}
                          if add:
                              filled_days[m] = filled_days.get(m, set()) | set(add)
                              d1 = pd.concat([d1, pd.Series(add)]).sort_index()
                      series[sid] = d1
                  dates, rows = build_market(m, series)
                  dates, rows = drop_weekends(dates, rows)
                  # 직전 배포본에 있던 거래일이 이번 결과에서 빠지면 그 값을 그대로 살린다 (한 번 들어온 날짜는 사라지지 않게)
                  if prev and prev.get("dates", {}).get(m):
                      pdates = prev["dates"][m]
                      lost = [d for d in pdates if d >= START and d not in dates and is_weekday(d)]
                      if lost:
                          union = sorted(set(dates) | set(lost))
                          for sid in list(rows.keys()):
                              nmap = dict(zip(dates, rows[sid]))
                              pmap = dict(zip(pdates, prev.get("s", {}).get(sid) or []))
                              vals, lastv = [], None
                              for d in union:
                                  v_ = nmap.get(d) if d in nmap else pmap.get(d)
                                  if v_ is not None:
                                      lastv = v_
                                  vals.append(lastv)
                              rows[sid] = vals
                          dates = union
                          print(f"{m}: 직전 배포본에서 살린 거래일 {lost}")
                  missing = [sid for sid, v in SYMBOLS.items() if v["m"] == m and sid not in rows]
                  if prev and missing:
                      pdates = prev.get("dates", {}).get(m, [])
                      for sid in missing:
                          old = prev.get("s", {}).get(sid)
                          if not old:
                              continue
                          omap = dict(zip(pdates, old))
                          vals, lastv = [], None
                          for d in dates:
                              if omap.get(d) is not None:
                                  lastv = omap[d]
                              vals.append(lastv)
                          if any(v is not None for v in vals):
                              rows[sid] = vals
                  if not dates and prev:
                      dates = prev.get("dates", {}).get(m, [])
                      for sid, v in SYMBOLS.items():
                          if v["m"] == m and sid in prev.get("s", {}):
                              rows[sid] = prev["s"][sid]
                  result["dates"][m] = dates
                  result["s"].update(rows)
                  result["miss"] += [sid for sid, v in SYMBOLS.items() if v["m"] == m and sid not in rows]
              if FX_SYMBOL in got:
                  fx = got[FX_SYMBOL]
                  result["fx"] = {"d": [to_date(d) for d in fx.index], "c": [round(float(x), 2) for x in fx.values]}
              elif prev and prev.get("fx"):
                  result["fx"] = prev["fx"]
              total = len(SYMBOLS) - len(result["miss"])
              if total == 0 and prev:
                  print("no daily data — keeping previous prices.json", file=sys.stderr)
                  result = prev
              (out / "prices.json").write_text(json.dumps(result, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")

              # ── 2) 장기 봉 (하루 한 번) ──
              today = now.strftime("%Y-%m-%d")
              sched = os.environ.get("GITHUB_EVENT_SCHEDULE", "")
              # 일봉에 거래량(v)이 없는 예전 파일이면 오늘 이미 받았더라도 다시 받는다
              no_vol = bool(prev_hist) and not any((x.get("d1") or {}).get("v") for x in prev_hist.get("s", {}).values())
              need_hist = (not prev_hist) or prev_hist.get("asof") != today or sched.startswith("17 ") or no_vol
              hist = prev_hist if (prev_hist and not need_hist) else {"asof": today, "s": {}}
              # 오늘 이미 받았더라도, 새로 추가된 종목(장기 봉이 없는 종목)은 그 종목만 바로 받는다
              new_ids = [] if need_hist else [sid for sid in SYMBOLS if not (hist["s"].get(sid) or {}).get("d1")]
              if new_ids:
                  ys_new = [SYMBOLS[sid]["y"] for sid in new_ids]
                  n1v = {}
                  n1 = download(ys_new, period="2y", interval="1d", vols=n1v)
                  nwk = download(ys_new, period="10y", interval="1wk")
                  nmo = download(ys_new, period="max", interval="1mo")
                  for sid in new_ids:
                      y, m = SYMBOLS[sid]["y"], SYMBOLS[sid]["m"]
                      hist["s"][sid] = {
                          "d1": series_days(m, n1[y], n1v.get(y)) if y in n1 else None,
                          "wk": series_days(m, nwk[y]) if y in nwk else None,
                          "mo": series_days(m, nmo[y]) if y in nmo else None,
                      }
                  print(f"hist added for new symbols: {len(new_ids)} (d1 {len(n1)}, wk {len(nwk)}, mo {len(nmo)})")
              if need_hist:
                  d1v = {}
                  d1 = download(ysyms, period="2y", interval="1d", vols=d1v)
                  wk = download(ysyms, period="10y", interval="1wk")
                  mo = download(ysyms, period="max", interval="1mo")
                  for sid, v in SYMBOLS.items():
                      y, m = v["y"], v["m"]
                      old = (prev_hist or {}).get("s", {}).get(sid, {})
                      hist["s"][sid] = {
                          "d1": series_days(m, d1[y], d1v.get(y)) if y in d1 else old.get("d1"),
                          "wk": series_days(m, wk[y]) if y in wk else old.get("wk"),
                          "mo": series_days(m, mo[y]) if y in mo else old.get("mo"),
                      }
                  print(f"hist refreshed: d1 {len(d1)}, wk {len(wk)}, mo {len(mo)}")
              (out / "hist.json").write_text(json.dumps(hist, separators=(",", ":")), encoding="utf-8")

              # ── 3) 장중 봉 (매번). 5분 봉은 위에서 받았다 ──
              h1 = download(ysyms, period="1mo", interval="60m")
              for sid, v in SYMBOLS.items():
                  y, m = v["y"], v["m"]
                  hs = hist["s"].get(sid, {}) if hist else {}
                  doc = {"v": 1, "t": result.get("updated"),
                         "i5": series_secs(m, i5[y], i5l.get(y), i5h.get(y)) if y in i5 else None,
                         "h1": series_secs(m, h1[y]) if y in h1 else None,
                         "d1": hs.get("d1"), "wk": hs.get("wk"), "mo": hs.get("mo")}
                  (out / "c" / (sid.replace(":", "_") + ".json")).write_text(json.dumps(doc, separators=(",", ":")), encoding="utf-8")

              print(f"ok: {total}/{len(SYMBOLS)} symbols, KR {len(result['dates'].get('KR', []))} days, "
                    f"US {len(result['dates'].get('US', []))} days, intraday {len(i5)}/{len(ysyms)}, "
                    f"hourly {len(h1)}/{len(ysyms)}, hist {'new' if need_hist else 'reused'}, "
                    f"5분봉으로 채운 날 {{{', '.join(f'{k}: {sorted(v)}' for k, v in filled_days.items())}}}, missing: {result['miss']}")


          if __name__ == "__main__":
              main()
          PY
          cat > fetch_extra.py <<'PY'
          """SEED 10K 추가 자료 수집 (GitHub Actions 안에서 실행, 표준 라이브러리만 쓴다).

          만드는 파일 (--out 폴더)
            rates.json    한·미 국채 금리 (네이버 증권). 실행할 때마다 최신값, 날짜별 종가는 직전 배포본에 이어 붙인다
            lotto.json    로또6/45 회차별 당첨번호·등수별 1게임당 당첨금·당첨자 수 (동행복권). 새 회차가 나올 때만 받는다
            housing.json  지역별 아파트 ㎡당 평균 매매가격 (한국부동산원 R-ONE, 월간). 하루 한 번 새 달이 나왔는지 본다
          인자: --out _site/data --prev prev
          """
          import argparse, json, re, time, urllib.request, datetime as dt
          from concurrent.futures import ThreadPoolExecutor

          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'}
          KST = dt.timezone(dt.timedelta(hours=9))


          def get(url, timeout=25, tries=3):
              err = None
              for k in range(tries):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=timeout) as r:
                          return r.read().decode('utf-8', 'replace')
                  except Exception as e:
                      err = e
                      time.sleep(1.5 * (k + 1))
              raise RuntimeError(f'{url}: {err}')


          def load(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except Exception:
                  return None


          def dump(path, obj):
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(obj, f, ensure_ascii=False, separators=(',', ':'))


          # ── 국채 금리 ──
          # 만기(년): 네이버 로이터 코드
          RATES = {
              'KR': {1: 'KR1YT=RR', 3: 'KR3YT=RR', 5: 'KR5YT=RR', 10: 'KR10YT=RR', 20: 'KR20YT=RR', 30: 'KR30YT=RR'},
              'US': {0.25: 'US3MT=RR', 1: 'US1YT=RR', 2: 'US2YT=RR', 5: 'US5YT=RR', 10: 'US10YT=RR', 30: 'US30YT=RR'},
          }


          def rates(prev):
              out = {'at': int(time.time()), 'cur': {}, 'hist': (prev or {}).get('hist', {})}
              jobs = [(c, str(m), code) for c, d in RATES.items() for m, code in d.items()]

              def one(j):
                  c, m, code = j
                  try:
                      r = json.loads(get(f'https://api.stock.naver.com/marketindex/bond/{code}'))
                      return c, m, float(r['closePrice']), r.get('localTradedAt') or ''
                  except Exception as e:
                      print('금리 실패', code, e)
                      return c, m, None, ''
              with ThreadPoolExecutor(6) as ex:
                  res = list(ex.map(one, jobs))
              old = (prev or {}).get('cur', {})
              for c, m, y, t in res:
                  key = f'{c}{m}'
                  if y is None:
                      if key in old:
                          out['cur'][key] = old[key]          # 못 받으면 직전 값을 그대로 둔다
                      continue
                  out['cur'][key] = [y, t]
                  day = t[:10] if re.match(r'\d{4}-\d{2}-\d{2}', t) else dt.datetime.now(KST).strftime('%Y-%m-%d')
                  h = out['hist'].setdefault(key, {})
                  h[day] = y
                  for d in sorted(h)[:-400]:                   # 최근 400일만
                      del h[d]
              print('금리', len(out['cur']), '개')
              return out


          # ── 로또6/45 ──
          # 1249회 = 2026-11-07(토) 20:35 추첨. 그 뒤로 매주 토요일 1회씩
          def lotto(prev):
              prev = prev if isinstance(prev, dict) and isinstance(prev.get('d'), list) else {'d': []}
              have = {d['r']: d for d in prev['d']}
              now = dt.datetime.now(KST)
              base = dt.datetime(2026, 11, 7, 20, 50, tzinfo=KST)
              expect = 1249 + (now - base).days // 7 if now >= base else 1248
              last = max(have) if have else 0
              if last >= expect:
                  print('로또 새 회차 없음 (최신', last, '회)')
                  return prev
              lo = max(last + 1, expect - 60)
              j = json.loads(get(f'https://www.dhlottery.co.kr/lt645/selectPstLt645Info.do?srchStrLtEpsd={lo}&srchEndLtEpsd={expect + 1}'))
              n = 0
              for d in j['data']['list']:
                  nums = [d[f'tm{k}WnNo'] for k in range(1, 7)]
                  balls = nums + [d['bnsWnNo']]
                  if not all(isinstance(x, int) and 1 <= x <= 45 for x in balls) or len(set(balls)) != 7:
                      print('로또 번호 이상, 건너뜀', d.get('ltEpsd'))
                      continue
                  y = str(d['ltRflYmd'])
                  have[d['ltEpsd']] = {'r': d['ltEpsd'], 'date': f'{y[:4]}-{y[4:6]}-{y[6:8]}', 'n': nums, 'b': d['bnsWnNo'],
                                       'amt': [d[f'rnk{k}WnAmt'] for k in range(1, 6)], 'cnt': [d[f'rnk{k}WnNope'] for k in range(1, 6)],
                                       'sales': d.get('rlvtEpsdSumNtslAmt')}
                  n += 1
              keep = sorted(have)[-110:]
              print('로또', n, '회차 추가, 최신', keep[-1] if keep else None)
              return {'at': int(time.time()), 'd': [have[r] for r in keep]}


          # ── 아파트 시세 (R-ONE (월) 평균단위매매가격_아파트, 천원/㎡) ──
          HOUSE_TBL = 'A_2024_00061'
          REGIONS = [
              ('530011', '종로구'), ('530012', '중구'), ('530013', '용산구'), ('530015', '성동구'), ('530016', '광진구'),
              ('530017', '동대문구'), ('530018', '중랑구'), ('530019', '성북구'), ('530020', '강북구'), ('530021', '도봉구'),
              ('530022', '노원구'), ('530024', '은평구'), ('530025', '서대문구'), ('530026', '마포구'), ('530029', '양천구'),
              ('530030', '강서구'), ('530031', '구로구'), ('530032', '금천구'), ('530033', '영등포구'), ('530034', '동작구'),
              ('530035', '관악구'), ('530037', '서초구'), ('530038', '강남구'), ('530039', '송파구'), ('530040', '강동구'),
              ('500009', '경기'), ('500010', '인천'), ('500011', '부산'), ('500012', '대구'), ('500013', '광주'),
              ('500014', '대전'), ('500015', '울산'), ('500016', '세종'), ('500017', '강원'), ('500018', '충북'),
              ('500019', '충남'), ('500020', '전북'), ('500021', '전남'), ('500022', '경북'), ('500023', '경남'),
              ('500024', '제주'), ('500008', '서울'), ('500001', '전국'),
          ]


          def ym_add(ym, k):
              y, m = int(ym[:4]), int(ym[4:])
              m += k
              while m > 12: y, m = y + 1, m - 12
              while m < 1: y, m = y - 1, m + 12
              return f'{y:04d}{m:02d}'


          def rone(cls, start, end):
              # 키 없는 시험 모드는 한 번에 5줄까지라 기간을 5달 이하로 잘라 부른다
              t = get(f'https://www.reb.or.kr/r-one/openapi/SttsApiTblData.do?STATBL_ID={HOUSE_TBL}&DTACYCLE_CD=MM'
                      f'&CLS_ID={cls}&ITM_ID=100001&START_WRTTIME={start}&END_WRTTIME={end}')
              rows = re.findall(r'<WRTTIME_IDTFR_ID>(\d{6})</WRTTIME_IDTFR_ID>.*?<DTA_VAL>([\d.]+)</DTA_VAL>', t, re.S)
              return {ym: round(float(v), 1) for ym, v in rows}


          def housing(prev):
              prev = prev if isinstance(prev, dict) and prev.get('r') else None
              now = time.time()
              if prev and now - prev.get('checked', 0) < 20 * 3600:
                  return prev
              latest = prev['ym'] if prev else '202609'
              nxt = ym_add(latest, 1)
              try:
                  probe = rone('500001', nxt, nxt)
              except Exception as e:
                  print('R-ONE 확인 실패', e)
                  return prev
              ym = nxt if probe else latest
              if prev and ym == latest:
                  prev['checked'] = int(now)
                  print('아파트 시세 새 달 없음 (최신', latest, ')')
                  return prev
              start = ym_add(ym, -4)

              def one(r):
                  cls, nm = r
                  try:
                      return cls, nm, rone(cls, start, ym)
                  except Exception as e:
                      print('R-ONE 실패', nm, e)
                      return cls, nm, None
              with ThreadPoolExecutor(6) as ex:
                  res = list(ex.map(one, REGIONS))
              old = (prev or {}).get('r', {})
              out = {'at': int(now), 'checked': int(now), 'ym': ym, 'unit': '천원/㎡', 'tbl': HOUSE_TBL, 'r': {}}
              for cls, nm, h in res:
                  if not h and cls in old:
                      out['r'][cls] = old[cls]
                  elif h:
                      out['r'][cls] = {'n': nm, 'h': h}
              print('아파트 시세', ym, len(out['r']), '지역')
              return out


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--out', required=True)
              ap.add_argument('--prev', default='prev')
              a = ap.parse_args()
              for name, fn in (('rates', rates), ('lotto', lotto), ('housing', housing)):
                  prev = load(f'{a.prev}/{name}.json')
                  try:
                      res = fn(prev)
                  except Exception as e:
                      print(name, '수집 실패:', e)
                      res = prev
                  if res:
                      dump(f'{a.out}/{name}.json', res)


          if __name__ == '__main__':
              main()
          PY

      - name: 시세 수집
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r icons _site/ 2>/dev/null || true   # 홈 화면 아이콘 (apple-touch-icon 등)
          python fetch_prices.py --out _site/data --prev prev > collect.log 2>&1 || echo "시세 수집 실패 — 게임은 '시세 없음'으로 표시된다" >> collect.log
          cat collect.log
          echo "::notice title=시세 수집 결과::$(tail -n 1 collect.log)"
          python fetch_extra.py --out _site/data --prev prev || echo "추가 자료(금리·로또·아파트) 수집 실패"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
