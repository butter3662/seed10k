name: 시세 수집과 배포

# 저장소에 필요한 파일은 index.html 과 이 파일 두 개뿐이다.
# Settings → Pages → Source 를 "GitHub Actions" 로 바꾼 뒤 Actions 탭에서 한 번 실행하면 된다.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 시간은 모두 UTC 기준이다.
    - cron: '*/5 0-6 * * 1-5'    # 한국 정규장 (한국 시각 09:00~15:55)
    - cron: '*/5 13-21 * * 1-5'  # 미국 정규장 (한국 시각 22:00~06:55, 서머타임과 평시 모두)
    - cron: '17 7,22 * * 1-5'    # 장 마감 뒤 최종 종가 반영

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 라이브러리 설치
        run: pip install --quiet yfinance pandas

      - name: 직전 시세 파일 받기 (이번에 못 받은 종목을 채우는 데 사용)
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/data/prices.json" -o prev.json || echo "직전 파일 없음"

      - name: 시세 수집 스크립트 만들기
        run: |
          cat > fetch_prices.py <<'PY'
          """SEED 10K 실제 시세 수집 스크립트.

          GitHub Actions에서 실행된다. 2026-10-23(기준일)부터 오늘까지의 일별 종가를
          야후 파이낸스(yfinance)에서 받아 data/prices.json으로 저장한다.
          장중에 실행하면 오늘 행의 종가 자리에 그 시점의 최신 가격이 들어간다.

          워크플로 안에서 실행된다: --out _site/data/prices.json --prev prev.json
          --prev 로 직전 파일을 주면, 이번에 받지 못한 종목은 직전 값으로 채운다.
          """
          import argparse
          import datetime as dt
          import json
          import math
          import pathlib
          import sys
          import time

          import pandas as pd
          import yfinance as yf

          START = "2026-10-23"
          import re
          _html = pathlib.Path("index.html").read_text(encoding="utf-8")
          _data = json.loads(re.search(r"const DATA = (\{.*?\});\n", _html, re.S).group(1))
          SYMBOLS = {}
          for _s in _data["kr"]:
              SYMBOLS[_s["id"]] = {"y": _s["t"] + (".KQ" if _s["x"] == "KOSDAQ" else ".KS"), "m": "KR"}
          for _s in _data["us"]:
              SYMBOLS[_s["id"]] = {"y": _s["t"], "m": "US"}
          FX_SYMBOL = "KRW=X"  # 1달러당 원


          def download(symbols, tries=3):
              """여러 종목의 일별 종가를 {야후심볼: pd.Series} 로 돌려준다."""
              out = {}
              pending = list(symbols)
              for attempt in range(tries):
                  if not pending:
                      break
                  try:
                      df = yf.download(
                          pending, start=START, interval="1d", group_by="ticker",
                          auto_adjust=False, actions=False, progress=False, threads=True, timeout=30,
                      )
                  except Exception as e:  # 네트워크 오류 등
                      print(f"download error (try {attempt + 1}): {e}", file=sys.stderr)
                      time.sleep(5)
                      continue
                  for sym in pending:
                      try:
                          if isinstance(df.columns, pd.MultiIndex):
                              col = df[sym]["Close"]
                          else:
                              col = df["Close"]
                      except KeyError:
                          continue
                      col = col.dropna()
                      if len(col):
                          out[sym] = col
                  pending = [s for s in pending if s not in out]
                  if pending:
                      time.sleep(3)
              return out


          def to_date(idx):
              return pd.Timestamp(idx).strftime("%Y-%m-%d")


          def build_market(m, series_by_id):
              """시장(KR/US)별 거래일 목록과 종목별 종가 배열을 만든다."""
              counts = {}
              for s in series_by_id.values():
                  for d in s.index:
                      k = to_date(d)
                      counts[k] = counts.get(k, 0) + 1
              n = max(1, len(series_by_id))
              # 받은 종목의 30% 이상이 값을 가진 날만 거래일로 본다 (일부 종목의 잘못된 행 제거)
              dates = sorted(d for d, c in counts.items() if c >= 0.3 * n)
              rows = {}
              for sid, s in series_by_id.items():
                  s = s.copy()
                  s.index = [to_date(d) for d in s.index]
                  s = s[~s.index.duplicated(keep="last")]
                  vals = []
                  lastv = None
                  for d in dates:
                      v = s.get(d)
                      if v is not None and not (isinstance(v, float) and math.isnan(v)):
                          lastv = float(v)
                      vals.append(None if lastv is None else (round(lastv) if m == "KR" else round(lastv, 2)))
                  rows[sid] = vals
              return dates, rows


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--out", required=True)
              ap.add_argument("--prev")
              a = ap.parse_args()

              prev = None
              if a.prev and pathlib.Path(a.prev).exists():
                  try:
                      prev = json.loads(pathlib.Path(a.prev).read_text(encoding="utf-8"))
                  except Exception:
                      prev = None

              ysyms = [v["y"] for v in SYMBOLS.values()]
              got = download(ysyms + [FX_SYMBOL])

              result = {"v": 1, "updated": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                        "start": START, "dates": {}, "s": {}, "miss": []}

              for m in ("KR", "US"):
                  series = {sid: got[v["y"]] for sid, v in SYMBOLS.items() if v["m"] == m and v["y"] in got}
                  dates, rows = build_market(m, series)
                  missing = [sid for sid, v in SYMBOLS.items() if v["m"] == m and sid not in rows]
                  # 이번에 못 받은 종목은 직전 파일 값을 날짜에 맞춰 재사용한다
                  if prev and missing:
                      pdates = prev.get("dates", {}).get(m, [])
                      for sid in missing:
                          old = prev.get("s", {}).get(sid)
                          if not old:
                              continue
                          omap = dict(zip(pdates, old))
                          vals, lastv = [], None
                          for d in dates:
                              if omap.get(d) is not None:
                                  lastv = omap[d]
                              vals.append(lastv)
                          if any(v is not None for v in vals):
                              rows[sid] = vals
                  if not dates and prev:  # 이 시장 전체를 못 받았으면 직전 파일을 그대로 쓴다
                      dates = prev.get("dates", {}).get(m, [])
                      for sid, v in SYMBOLS.items():
                          if v["m"] == m and sid in prev.get("s", {}):
                              rows[sid] = prev["s"][sid]
                  result["dates"][m] = dates
                  result["s"].update(rows)
                  result["miss"] += [sid for sid, v in SYMBOLS.items() if v["m"] == m and sid not in rows]

              if FX_SYMBOL in got:
                  fx = got[FX_SYMBOL]
                  result["fx"] = {"d": [to_date(d) for d in fx.index], "c": [round(float(x), 2) for x in fx.values]}
              elif prev and prev.get("fx"):
                  result["fx"] = prev["fx"]

              total = len(SYMBOLS) - len(result["miss"])
              if total == 0:
                  print("no data at all — keeping previous file", file=sys.stderr)
                  if prev:
                      result = prev
                  else:
                      sys.exit(1)

              out = pathlib.Path(a.out)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(result, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
              print(f"ok: {total}/{len(SYMBOLS)} symbols, KR {len(result['dates'].get('KR', []))} days, "
                    f"US {len(result['dates'].get('US', []))} days, missing: {result['miss']}")


          if __name__ == "__main__":
              main()
          PY

      - name: 시세 수집
        run: |
          mkdir -p _site/data
          cp index.html _site/
          python fetch_prices.py --out _site/data/prices.json --prev prev.json || echo "시세 수집 실패 — 게임은 '시세 없음'으로 표시된다"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
