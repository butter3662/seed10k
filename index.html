/* ───────── 블랙잭 ─────────
   규칙: 6벌(312장)을 판마다 새로 섞는다(카드 세기 없음). 딜러는 소프트 17 포함 17 이상이면 선다(S17).
   딜러 업카드가 A·10이면 먼저 블랙잭인지 확인(피크)하고, 딜러가 블랙잭이면 처음 건 판돈만 잃는다.
   더블다운: 처음 두 장일 때 언제나(스플릿 뒤에도). 스플릿: 같은 숫자 두 장, 최대 4손. A를 나누면 한 장씩만 받고 다시 못 나눈다.
   스플릿한 손의 A+10은 블랙잭이 아니라 21. 보험·서렌더 없음.
   지급(받는 돈, 판돈 포함): 이기면 2배, 비기면 1배, 블랙잭 BJ.bjPay배.
   BJ.bjPay: 보통 카지노처럼 2.5배(3:2). 기본 전략으로 150만 판 돌려 본 처음 판돈 대비 평균 손익은 −0.39% ± 0.18%(95%),
   기본 전략 없이 버스트만 피하면 약 −6%. 가장 잘 해도 조금씩 잃도록 일부러 다른 도박(기대 배수 1)보다 불리하게 둔다 */
const BJ = {decks:6, bjPay:2.5, maxHands:4};
const BJE = {
  // 카드: 0~51 → 숫자 r = c % 13 + 1 (1=A, 11~13=J·Q·K), 무늬 s = floor(c / 13) % 4
  rank: c => c % 13 + 1,
  val: c => Math.min(10, c % 13 + 1),
  total(cards){ let t = 0, a = 0; for (const c of cards){ const v = BJE.val(c); t += v; if (v === 1) a++; } const soft = a > 0 && t + 10 <= 21; return {t:soft ? t + 10 : t, soft}; },
  isBJ: cards => cards.length === 2 && BJE.total(cards).t === 21,
  shoe(rnd){ const n = 52 * BJ.decks, a = Array.from({length:n}, (_, k) => k); for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  draw(g){ return g.shoe[g.ix++]; },
  newRound(stake, rnd){
    const g = {v:1, stake, shoe:BJE.shoe(rnd), ix:0, hands:[], dealer:[], hole:true, phase:'play', cur:0, cost:stake, pay:0, log:[]};
    const p1 = BJE.draw(g), d1 = BJE.draw(g), p2 = BJE.draw(g), d2 = BJE.draw(g);
    g.hands.push({cards:[p1, p2], bet:stake, done:false, dbl:false, split:false, res:null});
    g.dealer = [d1, d2];
    const up = BJE.val(d1), pbj = BJE.isBJ(g.hands[0].cards), dbj = BJE.isBJ(g.dealer);
    if ((up === 1 || up === 10) && dbj){ g.hole = false; g.hands[0].done = true; BJE.settle(g); }   // 딜러 블랙잭 (피크)
    else if (pbj){ g.hands[0].done = true; g.hole = false; BJE.settle(g); }
    return g;
  },
  hand: g => g.hands[g.cur],
  can(g, a){
    if (g.phase !== 'play') return false;
    const h = BJE.hand(g); if (!h || h.done) return false;
    const two = h.cards.length === 2;
    if (a === 'hit' || a === 'stand') return true;
    if (a === 'double') return two;
    if (a === 'split') return two && BJE.rank(h.cards[0]) === BJE.rank(h.cards[1]) && g.hands.length < BJ.maxHands && !(h.split && BJE.rank(h.cards[0]) === 1);
    return false;
  },
  // 사람이 고른 행동. 돈(더블·스플릿 추가 판돈)은 화면 쪽에서 먼저 낸다
  act(g, a){
    if (!BJE.can(g, a)) return false;
    const h = BJE.hand(g);
    if (a === 'hit'){ h.cards.push(BJE.draw(g)); if (BJE.total(h.cards).t >= 21) h.done = true; }
    else if (a === 'stand') h.done = true;
    else if (a === 'double'){ g.cost += h.bet; h.bet *= 2; h.dbl = true; h.cards.push(BJE.draw(g)); h.done = true; }
    else if (a === 'split'){
      const c2 = h.cards.pop(), ace = BJE.rank(c2) === 1;
      const h2 = {cards:[c2], bet:h.bet, done:false, dbl:false, split:true, res:null};
      h.split = true; g.cost += h.bet;
      h.cards.push(BJE.draw(g)); h2.cards.push(BJE.draw(g));
      g.hands.splice(g.cur + 1, 0, h2);
      if (ace){ h.done = true; h2.done = true; }                         // A 스플릿은 한 장씩만
      else { if (BJE.total(h.cards).t === 21) h.done = true; if (BJE.total(h2.cards).t === 21) h2.done = true; }
    }
    BJE.next(g);
    return true;
  },
  next(g){
    while (g.cur < g.hands.length && g.hands[g.cur].done) g.cur++;
    if (g.cur >= g.hands.length) BJE.dealerPlay(g);
  },
  dealerPlay(g){
    g.hole = false;
    const live = g.hands.some(h => BJE.total(h.cards).t <= 21);
    if (live) while (BJE.total(g.dealer).t < 17) g.dealer.push(BJE.draw(g));   // S17: 소프트 17에서도 선다
    BJE.settle(g);
  },
  settle(g){
    const d = BJE.total(g.dealer).t, dbj = BJE.isBJ(g.dealer);
    let pay = 0;
    for (const h of g.hands){
      const p = BJE.total(h.cards).t, pbj = !h.split && g.hands.length === 1 && BJE.isBJ(h.cards);
      let m;
      if (dbj) m = pbj ? 1 : 0;                          // 딜러 블랙잭: 내 블랙잭만 비김
      else if (pbj) m = BJ.bjPay;
      else if (p > 21) m = 0;
      else if (d > 21 || p > d) m = 2;
      else if (p === d) m = 1;
      else m = 0;
      h.res = pbj && m === BJ.bjPay ? 'bj' : m === 2 ? 'win' : m === 1 ? 'push' : 'lose';
      // 블랙잭은 처음 판돈 기준, 나머지는 그 손의 판돈(더블이면 2배) 기준
      pay += h.bet * m;
    }
    g.pay = Math.round(pay * 100) / 100; g.phase = 'over';
  },
  // 기본 전략 (6벌, S17, 더블다운 스플릿 뒤 허용, 서렌더 없음). 지급 배수를 정하는 시뮬레이션에만 쓴다 (화면에 추천을 보여 주지 않는다)
  basic(g){
    const h = BJE.hand(g), up = BJE.val(g.dealer[0]), u = up === 1 ? 11 : up;
    const {t, soft} = BJE.total(h.cards), two = h.cards.length === 2;
    const D = a => (two ? 'double' : a);
    if (BJE.can(g, 'split')){
      const r = BJE.val(h.cards[0]);
      const sp = r === 1 || r === 8 || (r === 9 && u !== 7 && u !== 10 && u !== 11) || (r === 7 && u <= 7) || (r === 6 && u <= 6) || (r === 4 && (u === 5 || u === 6)) || ((r === 2 || r === 3) && u <= 7);
      if (sp) return 'split';
    }
    if (soft){
      if (t >= 19) return 'stand';
      if (t === 18) return u >= 3 && u <= 6 ? D('stand') : u <= 8 ? 'stand' : 'hit';
      if (t === 17) return u >= 3 && u <= 6 ? D('hit') : 'hit';
      if (t === 15 || t === 16) return u >= 4 && u <= 6 ? D('hit') : 'hit';
      return u >= 5 && u <= 6 ? D('hit') : 'hit';         // A2, A3
    }
    if (t >= 17) return 'stand';
    if (t >= 13) return u <= 6 ? 'stand' : 'hit';
    if (t === 12) return u >= 4 && u <= 6 ? 'stand' : 'hit';
    if (t === 11) return u <= 10 ? D('hit') : 'hit';
    if (t === 10) return u <= 9 ? D('hit') : 'hit';
    if (t === 9) return u >= 3 && u <= 6 ? D('hit') : 'hit';
    return 'hit';
  },
};

/* ── 블랙잭 화면 (도박 탭 카드) ── */
function bjS(){ if (!S.bj || typeof S.bj !== 'object') S.bj = {cur:null, hist:[]}; return S.bj; }
const BJV = {shown:null, t:null, anim:false, seen:new Set(), now:new Set()};   // shown: 딜러 카드를 몇 장까지 보였는지. seen: 이미 그린 카드(새 카드만 날아오게)
const BJ_SUIT = ['♠', '♥', '♦', '♣'];
function bjCardHTML(c, back, k, key, V = BJV){   // V: 어떤 카드를 이미 그렸는지 (혼자 하기 BJV / 같이 하기 MP.view.bjV)
  const id = key + (back ? 'b' : 'f'); V.now.add(id);
  const fresh = !V.seen.has(id), flip = fresh && !back && V.seen.has(key + 'b');   // 엎어 둔 카드를 뒤집을 때는 뒤집기 연출
  const cl = fresh ? (flip ? ' flip' : ' new') : '';
  if (back) return `<span class="bjc back${cl}" style="--k:${k}"></span>`;
  const r = BJE.rank(c), s = Math.floor(c / 13) % 4, red = s === 1 || s === 2;
  return `<span class="bjc${red ? ' red' : ''}${cl}" style="--k:${k}"><b>${r === 1 ? 'A' : r === 11 ? 'J' : r === 12 ? 'Q' : r === 13 ? 'K' : r}</b><i>${BJ_SUIT[s]}</i><em>${BJ_SUIT[s]}</em></span>`;
}
const bjTot = cards => { const {t, soft} = BJE.total(cards); return soft && t < 21 ? `${t - 10}/${t}` : `${t}`; };
const BJ_ACT = {hit:'히트', stand:'스탠드', double:'더블', split:'스플릿'};
function bjCardInnerHTML(){
  const s = bjS(), g = s.cur;
  INFO.bj = {t:'블랙잭', h:`<div class="prose"><ul><li>딜러보다 21에 가깝게 만들면 이깁니다. 21을 넘으면 집니다. A는 1이나 11, J·Q·K는 10.</li>
    <li>6벌(312장)을 판마다 새로 섞습니다.</li>
    <li>딜러가 A나 10을 보이면 먼저 블랙잭인지 확인합니다. 딜러가 블랙잭이면 처음 건 판돈만 잃습니다.</li>
    <li><b>히트</b> 한 장 더 · <b>스탠드</b> 그만 · <b>더블</b> 처음 두 장일 때 판돈을 두 배로 하고 한 장만 더 · <b>스플릿</b> 같은 숫자 두 장을 두 손으로 나눔(판돈 한 번 더, 최대 4손, A는 한 장씩만).</li>
    <li>받는 돈(판돈 포함): 이기면 2배, 비기면 1배, 처음 두 장이 블랙잭(A+10)이면 <b>${BJ.bjPay}배</b>. 스플릿한 손의 21은 블랙잭이 아닙니다. 보험·서렌더는 없습니다.</li></ul>
    <p>보통 카지노와 같은 지급(블랙잭 3:2)이라, 매번 가장 유리한 행동을 골라도 평균적으로 판돈의 약 0.4%를 잃습니다. 판돈 한도: ${fmtUSDn(GAM.bj.off, 0)} (불법 모드 ${fmtUSDn(GAM.bj.on, 0)}).</p></div>`};
  if (!g){
    const h = s.hist.slice(0, 3).map(x => `<span class="${cls(x.pay - x.cost)}">${x.res} ${signUSD(x.pay - x.cost)}</span>`).join(' · ');

/* ───────── 벅샷 룰렛 (모티브: Mike Klubnika의 Buckshot Roulette, 2023) ─────────
   산탄총에 실탄과 공포탄을 섞어 넣는다. 몇 발씩인지는 모두에게 알려 주지만 순서는 모른다.

   이 규칙 부분(BS ~ BSE)은 라즈베리파이 심판도 같은 코드를 쓴다 (build.py가 pi/bs_engine.js로 떼어 낸다) */
const BS = {hpMax:4, perLoad:2, itemMax:8, minShells:2, maxShells:8};

  cig:{nm:'담배', ic:'🚬', d:'목숨 +1 (최대 4)'},
  beer:{nm:'맥주', ic:'🍺', d:'지금 탄을 쏘지 않고 빼냅니다 (무슨 탄이었는지 모두 봅니다)'},
  saw:{nm:'톱', ic:'🪚', d:'다음 한 발의 피해가 2배'},
  cuff:{nm:'수갑', ic:'⛓️', d:'고른 상대가 다음 차례를 한 번 쉽니다'},

  },
  log(g, t){ g.log.push(t); if (g.log.length > 40) g.log.splice(0, g.log.length - 40); },
  alive(g){ return g.pl.filter(p => !p.out).length; },
  reload(g, rnd, ev){

  take(g){   // 맨 앞 탄을 꺼낸다 (쏘거나 맥주로 빼거나). 그 탄을 본 기억은 지운다

    let gl = null;
    try { const c = document.createElement('canvas'); gl = c.getContext('webgl2') || c.getContext('webgl'); } catch(e){}

}

/* ── 웹소켓 (빠른 길) ── */
const MPW = {ws:null, url:'', ok:false, wait:null, seq:0, pend:new Map(), ping:null, fail:0, failAt:0};
function mpWsClose(){
  clearInterval(MPW.ping); MPW.ok = false;
  if (MPW.ws){ try { MPW.ws.onclose = null; MPW.ws.close(); } catch(e){} }
  MPW.ws = null; MPW.wait = null;
  MPW.pend.forEach(f => f({ok:false, err:'게임 서버 연결이 끊겼습니다', timeout:true})); MPW.pend.clear();
}
// 연결하고 로그인 확인까지 (최대 5초). 안 되면 false → 느린 길로
async function mpWs(){
  if (!ACC.user || !ACC.sb || typeof WebSocket === 'undefined') return false;
  if (!MP.wsUrl && !(await mpRefAlive(), MP.wsUrl)) return false;
  if (MPW.uid !== ACC.user.id){ mpWsClose(); MPW.uid = ACC.user.id; MPW.fail = 0; }   // 계정을 바꾸면 새로 로그인 확인
  // 살아 있는지: 10초마다 핑을 보내고 무엇이든 답이 오면 시각을 적는다. 25초 넘게 아무 답이 없으면 죽은 연결로 보고 새로 붙는다
  // (터널이 끊겨도 브라우저가 한참 동안 '열림'으로 알고 있어, 그 사이 보낸 요청이 '응답하지 않습니다'로 끝나던 문제)
  if (MPW.ok && MPW.ws && MPW.ws.readyState === 1 && MPW.url === MP.wsUrl && Date.now() - (MPW.seenAt || 0) > 25000) mpWsClose();
  if (MPW.ok && MPW.ws && MPW.ws.readyState === 1 && MPW.url === MP.wsUrl) return true;
  if (MPW.fail >= 3 && Date.now() - MPW.failAt < 60000) return false;   // 연달아 실패하면 1분 동안은 느린 길만
  if (MPW.wait && MPW.url === MP.wsUrl) return MPW.wait;
  mpWsClose();
  const url = MPW.url = MP.wsUrl;
  MPW.wait = new Promise(done => {
    let fin = false; const end = v => { if (fin) return; fin = true; clearTimeout(to); if (!v){ MPW.fail++; MPW.failAt = Date.now(); MP.refAt = 0; mpWsClose(); } else MPW.fail = 0; done(v); };
    const to = setTimeout(() => end(false), 5000);
    let ws; try { ws = MPW.ws = new WebSocket(url); } catch(e){ return end(false); }
    ws.onopen = async () => {
      let tok = null; try { tok = (await ACC.sb.auth.getSession()).data.session.access_token; } catch(e){}
      if (!tok) return end(false);
      ws.send(JSON.stringify({t:'auth', token:tok, dev:mpDev()}));
    };
    ws.onmessage = e => {
      MPW.seenAt = Date.now();
      let m; try { m = JSON.parse(e.data); } catch(x){ return; }
      if (m.t === 'auth'){
        if (!m.ok) return end(false);
        MPW.ok = true; end(true);
        clearInterval(MPW.ping); MPW.ping = setInterval(() => { try { ws.readyState === 1 && ws.send('{"t":"ping"}'); } catch(x){} }, 10000);
        if (MP.code) ws.send(JSON.stringify({t:'sub', code:MP.code}));
      } else if (m.t === 'res'){ const f = MPW.pend.get(m.id); if (f){ MPW.pend.delete(m.id); f({ok:!!m.ok, err:m.err, res:m.res || {}}); } }
      else if (m.t === 'room' && m.row && m.row.code === MP.code) mpSet(m.row);
      else if (m.t === 'chat' && m.code === MP.code) mpChatGot(m);
    };
    ws.onclose = ws.onerror = () => { if (MPW.ws !== ws) return; const was = MPW.ok; end(false); if (was && MP.code) setTimeout(() => mpWs(), 1000); };
  });
  return MPW.wait;
}
function mpWsSub(code){ if (MPW.ok && MPW.ws && MPW.ws.readyState === 1) try { MPW.ws.send(JSON.stringify({t:'sub', code})); } catch(e){} else mpWs(); }
// 요청: 웹소켓이 되면 바로 보내고 답을 기다린다 (최대 15초). 안 되면 Supabase 표로
// 이 브라우저의 무작위 기기 ID (게임 서버가 같은 기기에서 만든 여러 계정이 한 방에 들어오는지 확인하는 데만 쓴다)
function mpDev(){
  let d = ''; try { d = localStorage.getItem('seed10k.dev') || ''; } catch(e){}
  if (!/^[a-z0-9]{8,40}$/.test(d)){ d = Array.from(crypto.getRandomValues(new Uint8Array(12)), x => x.toString(36).padStart(2, '0')).join('').slice(0, 20); try { localStorage.setItem('seed10k.dev', d); } catch(e){} }
  return d;
}
async function mpReq(code, kind, arg = {}){
  if (await mpWs()){
    const id = ++MPW.seq;
    const r = await new Promise(res => {
      MPW.pend.set(id, res);
      setTimeout(() => { if (MPW.pend.delete(id)){ mpWsClose(); MP.refAt = 0; res({ok:false, err:'게임 서버가 응답하지 않습니다', timeout:true}); } }, 15000);   // 답이 없는 연결은 끊고 다음에 새로 붙는다
      try { MPW.ws.send(JSON.stringify({t:'req', id, code, kind, arg})); } catch(e){ MPW.pend.delete(id); res({ok:false, err:'게임 서버에 보내지 못했습니다', timeout:true}); }
    });
    return r;
  }
  return mpReqDb(code, kind, arg);
}
// 느린 길: 요청을 넣고 심판이 처리할 때까지 기다린다 (최대 60초)
async function mpReqDb(code, kind, arg = {}){
  const {data, error} = await ACC.sb.from('seed10k_room_reqs').insert({user_id:ACC.user.id, code, kind, arg}).select('id').single();
  if (error) return {ok:false, err:errText(error)};
  const t0 = Date.now();
  while (Date.now() - t0 < 60000){
    await new Promise(r => setTimeout(r, Date.now() - t0 < 3000 ? 300 : 1000));
    const {data:r} = await ACC.sb.from('seed10k_room_reqs').select('done,ok,err,res').eq('id', data.id).maybeSingle();
    if (r && r.done) return {ok:!!r.ok, err:r.err, res:r.res || {}};
    if (Date.now() - t0 > 8000 && !MP.slowWarned){ MP.slowWarned = true; toast('게임 서버(라즈베리파이) 응답이 늦습니다. 조금 더 기다립니다'); }
  }
  return {ok:false, err:'게임 서버가 응답하지 않습니다', timeout:true};
}

function mpEnter(code, spec){
  MP.spec = !!spec; MP.code = code;

function mpSub(code){
  if (MP.ch){ try { ACC.sb.removeChannel(MP.ch); } catch(e){} MP.ch = null; }
  try {
    // 방 채널: 방 상태 변경 + 채팅 방송 + 접속(Presence: 이 방 화면을 보고 있는 사람. 자리에 없는 사람이 관전자)
    MP.watch = [];
    const ch = MP.ch = ACC.sb.channel('room-' + code, {config:{presence:{key:ACC.user ? ACC.user.id : 'anon'}}}).on('postgres_changes', {event:'*', schema:'public', table:'seed10k_rooms', filter:`code=eq.${code}`}, p => { if (p.new && p.new.code === MP.code) mpSet(p.new); })
      .on('broadcast', {event:'chat'}, m => { const p = m && m.payload; if (p && p.code === MP.code) mpChatGot(p); })
      .on('presence', {event:'sync'}, () => { if (MP.ch === ch) mpWatchSync(ch); })
      .subscribe(st => { if (st === 'SUBSCRIBED' && ACC.user) try { ch.track({uid:ACC.user.id, nick:mpNick()}); } catch(e){} });
  } catch(e){}
  mpWsSub(code);
  clearInterval(MP.poll); MP.poll = setInterval(() => { if (!document.hidden && MP.code) mpFetch(); }, 3000);   // 실시간을 놓칠 때를 위해
}
async function mpFetch(){
  if (!MP.code || !ACC.sb) return;
  const {data} = await ACC.sb.from('seed10k_rooms').select('*').eq('code', MP.code).maybeSingle();
  if (data) mpSet(data);
}
function mpSet(room){

  MP.room = room;
  if (mpMe() >= 0) mpPendSeated(room.code);
  // 판이 시작했다 → 3초 뒤 판돈 장부 확인 (시작 번호가 바뀐 것을 처음 본 때 한 번)
  const meS = mpMe() >= 0 ? room.state.seats[mpMe()] : null;
  if (meS && meS.pay === 'start' && room.state.startN && room.status !== 'lobby'){
    const bk = `mp:${room.code}:${room.state.startN}`;
    if (!MP.audited) MP.audited = new Set();
    if (!MP.audited.has(bk)){ MP.audited.add(bk); setTimeout(() => mpBetAudit(room, bk), BET_AUDIT_MS); }
  }
  if (MP.ch && MP.ch.presenceState && (!prev || prev.state.seats.length !== room.state.seats.length)) try { mpWatchSync(MP.ch); } catch(e){}   // 자리가 바뀌면 관전자 목록도
  if (room.status === 'lobby') MP.view.bjV = null;   // 새 판이면 카드를 처음부터 날아오게
  const ev = room.state.ev;
  if (ev && ev.seq > MP.lastSeq){ MP.lastSeq = ev.seq; mpOnEv(ev, prev); }
  if (room.status === 'closed' || (room.status !== 'lobby' && mpMe() < 0 && !(prev && prev.state.seats.some(s => ACC.user && s.uid === ACC.user.id)))) {}
  if (room.game === 'bm') mbmSync(room);
  mpRender();
  if ((room.status === 'over' || room.status === 'closed') && !MP.view.bmHold) mpClaim();   // 부루마블은 움직임을 다 보여 준 뒤에 받는다
}
function mpOnEv(ev, prev){
  if (ev.t === 'bs'){ if (prev && prev.code === MP.room.code && prev.status === 'play'){ (MP.view.bsQ = MP.view.bsQ || []).push(ev); MP.view.bmHold = true; mbsRun(); } return; }
  if (ev.t === 'bm'){ if (prev && prev.code === MP.room.code && prev.status === 'play' && BMV.mp && bmOpenNow()){ (MP.view.bmQ = MP.view.bmQ || []).push(ev); MP.view.bmHold = true; mbmRun(); } return; }
  if (ev.t === 'sl'){ if (prev && prev.code === MP.room.code && prev.status === 'play'){ (MP.view.slQ = MP.view.slQ || []).push(ev); mslRun(); } return; }
  if (ev.t === 'oe_reveal'){ MP.view.oeShow = ev; clearTimeout(MP.view.oeT); MP.view.oeT = setTimeout(() => { MP.view.oeShow = null; mpRender(); }, 2200); }
}

const MBS_RULES = [['clean', '클린 모드', '아이템이 없습니다'], ['blind', '블라인드 모드', '상대의 아이템을 볼 수 없습니다'], ['hidden', '미스터리 모드', '실탄·공포탄이 각각 몇 발 들어갔는지 알 수 없습니다 (전체 발수만 압니다)']];

async function mpAct(kind, arg, spent){
  if (MP.busy) return; MP.busy = true; mpRender();
  try {
    const pid = spent ? mpPendAdd(MP.code, spent) : null;
    const r = await mpReq(MP.code, kind, arg);
    if (pid && (r.ok || !r.timeout)) mpPendDone(pid);
    if (!r.ok){ if (spent && !r.timeout){ receiveUSD(spent); commit(); } toast(r.err, true); }
    await mpFetch();
  } finally { MP.busy = false; mpRender(); }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'mpNewBtn') return mpNew();
  if (t.id === 'onlBtn') return onlOpen(null);
  if (t.id === 'onlInv') return onlOpen(MP.room);
  if (t.id === 'mpJoinBtn') return mpJoin();
  if (t.id === 'mpWatchBtn') return mpWatchList();
  if (t.id === 'mpResume'){ let c = null; try { c = localStorage.getItem(mpKey()); } catch(e){} if (c) mpEnter(c); return; }
  if (t.id === 'mpClose'){
    // 대기실에서 닫으면 나가기와 같다: 자리를 비우고 판돈을 바로 돌려받는다 (예전에는 자리를 둔 채 창만 닫혀, 20분 뒤에야 환불이 들어왔다)
    const R = MP.room;
    if (R && R.status === 'lobby' && mpMe() >= 0){
      t.disabled = true;
      const r = await mpReq(MP.code, 'leave');
      if (!r.ok){ t.disabled = false; return toast(r.err, true); }
      mpForget(); mpHide(); setTimeout(mpClaim, 800); toast('대기실에서 나왔습니다');
      return;
    }
    if (MP.spec && mpMe() < 0){ mpForget(); }   // 관전은 닫으면 끝
    return mpHide();
  }
  if (t.id === 'mpCopy'){ try { await navigator.clipboard.writeText(MP.code); toast('방 코드를 복사했습니다'); } catch(e){ toast(`방 코드: ${MP.code}`); } return; }
  if (t.id === 'mpStart') return mpAct('start');
  if (t.id === 'mpLeave'){
    const R = MP.room;
    if (!R || R.status === 'closed' || mpMe() < 0 || R.status === 'over'){ if (R && R.status === 'over' && mpMe() >= 0) mpReq(MP.code, 'leave'); mpForget(); mpHide(); return; }
    const playing = R.status === 'play';
    const c = showModal(`<h2>방에서 나갈까요?</h2><p>${playing ? '진행 중에 나가면 <b>기권</b>으로 처리되어 판돈을 잃습니다.' : R.host === ACC.user.id ? '방장이 나가면 방이 닫힙니다. 아직 시작 전이라 판돈은 빠지지 않습니다.' : '아직 시작 전이라 판돈은 빠지지 않습니다.'}</p>
      <div class="acts"><button class="btn" data-close>취소</button><button class="btn solid" id="mpLeaveYes">나가기</button></div>`);
    $('#mpLeaveYes').onclick = async () => { c(); const r = await mpReq(MP.code, 'leave'); if (!r.ok) return toast(r.err, true); mpForget(); mpHide(); setTimeout(mpClaim, 800); };
    return;
  }
  if (t.id === 'mpRejoin' || t.id === 'mpAgain'){
    const R = MP.room; if (!R) return;
    if (gamUsable() < R.stake) return toast(`달러·원화 통장을 합쳐 ${fmtUSD(R.stake)}이 있어야 합니다`, true);
    if (R.mode !== S.mode) return toast('같은 모드에서만 참가할 수 있습니다', true);
    if (R.il && !gamIl()){ gamS().il = true; commit(); }
    return mpAct(t.id === 'mpAgain' ? 'again' : 'join', {mode:S.mode, il:gamIl(), nick:mpNick(), payAtStart:true});   // 판돈은 시작할 때 서버가 가져간다
  }
  if (t.dataset.mpa){ const a = JSON.parse(t.dataset.mpa); return mpAct('act', a); }
});

/* ── 받을 돈 가져오기 (끝난 판, 환불) ── */
async function mpClaim(){
  if (!ACC.sb || !ACC.user || MP.claiming) return;
  MP.claiming = true;
  try {
    const {data} = await ACC.sb.from('seed10k_payouts').select('*').eq('user_id', ACC.user.id).eq('mode', S.mode).is('claimed_at', null).order('id', {ascending:true}).limit(20);
    for (const p of data || []){
      // 받음 표시가 먼저 성공한 기기만 돈을 받는다 (여러 탭·기기에서 두 번 받지 않게)
      const {data:got} = await ACC.sb.from('seed10k_payouts').update({claimed_at:new Date().toISOString()}).eq('id', p.id).is('claimed_at', null).select('id');
      if (!got || !got.length) continue;
      const amt = +p.amount || 0, net = Math.round((amt - (+p.cost || 0)) * 100) / 100;
      const bk = amt < 0 ? mpBetKey(p.code, p.note) : null;
      if (bk && betHas(bk)) continue;   // 이 판의 판돈은 이미 장부에 있다 (시작 확인 때 먼저 청구했거나 이미 냄) → 두 번 빼지 않는다
      if (amt > 0) receiveUSD(amt);
      else if (amt < 0){ gamPay(-amt); if (bk) betPaid(bk, -amt); }   // 판이 시작할 때 서버가 가져가는 판돈 (달러가 모자라면 원화에서 자동 환전, 그래도 모자라면 마이너스통장)
      const gnm = (MP_GAMES[p.game] || {}).nm || '같이 하기';
      altLog('gamble', amt < 0 ? `👥 ${gnm} 판돈 냄` : `👥 ${p.note || gnm}${p.il ? ' (불법)' : ''}`, amt < 0 ? amt : net, 'USD');
      commit();
      if (amt > 0) toast(`👥 ${p.note || '같이 하기'}: ${fmtUSD(amt)}을 받았습니다`);
      else if (amt < 0){ toast(`👥 ${gnm} 시작: 판돈 ${fmtUSD(-amt)}을 냈습니다`); continue; }
      if (p.il && GAM[p.game] && !/환불/.test(p.note || '')) police(p.game, true, net);   // 환불은 단속하지 않는다
      if (!/환불/.test(p.note || '')) runCheck();   // 도망친 뒤의 '이후 판'에는 같이 하기 판도 들어간다
    }
  } catch(e){ console.warn('[seed10k] 받을 돈 확인 실패', e); }
  finally { MP.claiming = false; }
}
function mpWatchPayouts(){

}

/* ── 접속 중인 사람 · 대결 신청 ──
   Supabase 실시간 Presence 채널 하나에 로그인한 사람이 모두 들어가 {id, 닉네임, 모드}를 알린다 (데이터베이스에 저장하지 않는다).
   대결 신청은 같은 채널의 Broadcast로 보낸다: 받는 사람 화면에 창이 뜨고, 수락하면 코드로 참가할 때와 같은 확인(판돈 내기)을 거친다.
   신청 내용은 방 코드를 알려 줄 뿐이라, 가짜 신청이 와도 방 확인·판돈 확인을 그대로 거친다 */
const ONL = {ch:null, list:[], sent:'', q:''};
function onlStop(){ if (ONL.ch){ try { ACC.sb.removeChannel(ONL.ch); } catch(e){} } ONL.ch = null; ONL.list = []; ONL.sent = ''; onlCount(); }
function onlStart(){
  onlStop();
  if (!ACC.user || !ACC.sb) return;
  const uid = ACC.user.id;
  try {
    const ch = ACC.sb.channel('seed10k-online', {config:{presence:{key:uid}, broadcast:{self:false}}});
    ch.on('presence', {event:'sync'}, () => onlSync(ch))
      .on('broadcast', {event:'invite'}, m => onlGot(m && m.payload))
      .on('broadcast', {event:'invite_no'}, m => { const p = m && m.payload; if (p && ACC.user && p.to === ACC.user.id) toast(`${p.nick}님이 대결 신청을 거절했습니다`); })
      .subscribe(st => { if (st === 'SUBSCRIBED'){ ONL.sent = ''; onlTrack(); } });
    ONL.ch = ch;
  } catch(e){}
}
function onlTrack(){   // 닉네임·모드가 바뀌었을 때만 다시 알린다
  if (!ONL.ch || !ACC.user || !ACC.testerKnown) return;   // 테스트 계정인지 알기 전에는 접속 목록에 올리지 않는다
  if (ACC.tester){   // 테스트 계정은 남의 접속 목록에 안 보인다 (대결 신청을 받을 수 없게)
    if (ONL.sent !== 'T'){ ONL.sent = 'T'; try { const r = ONL.ch.untrack(); if (r && r.catch) r.catch(() => {}); } catch(e){} }
    return;
  }
  const me = {uid:ACC.user.id, nick:mpNick(), mode:S.mode}, k = JSON.stringify(me);
  if (k === ONL.sent) return;
  ONL.sent = k;
  try { const r = ONL.ch.track(me); if (r && r.catch) r.catch(() => { ONL.sent = ''; }); } catch(e){ ONL.sent = ''; }
}
setInterval(onlTrack, 15000);
function onlSync(ch){
  const st = ch.presenceState() || {}, me = ACC.user ? ACC.user.id : '';
  ONL.list = Object.values(st).map(a => a[a.length - 1]).filter(p => p && p.uid && p.uid !== me)
    .sort((a, b) => (b.mode === S.mode) - (a.mode === S.mode) || String(a.nick).localeCompare(String(b.nick), 'ko'));
  onlCount(); if ($('#onlList')) onlDraw();
}
function onlCount(){ const n = $('#onlN'); if (n) n.textContent = ONL.list.length; }
function onlOpen(room){   // room: 대기실에서 부를 때 그 방
  if (!ACC.user) return toast('로그인해야 합니다', true);
  if (ACC.tester) return toast('테스트 계정은 멀티플레이를 할 수 없습니다', true);
  if (MP.banned) return toast('멀티플레이가 제한된 계정입니다', true);
  ONL.room = room || null; ONL.q = '';
  showModal(`<h2>🟢 접속 중인 사람</h2><p class="muted" style="margin:0 0 8px">${room ? `방 ${esc(room.code)}(${MP_GAMES[room.game].nm}, 판돈 ${fmtUSD(room.stake)})으로 부릅니다` : '이름을 눌러 대결을 신청하세요. 같은 모드끼리만 할 수 있습니다'}</p>
    <label class="amt"><input id="onlQ" type="search" autocomplete="off" placeholder="닉네임 검색" value="${esc(ONL.q)}"></label>
    <div id="onlList" class="onl-list"></div><div class="acts"><button class="btn" data-close>닫기</button></div>`);
  const q = $('#onlQ'); q.oninput = () => { ONL.q = q.value; onlDraw(); };
  onlDraw();
}
function onlDraw(){
  const box = $('#onlList'); if (!box) return;
  const q = ONL.q.trim().toLowerCase(), room = ONL.room;
  const list = ONL.list.filter(p => !q || String(p.nick).toLowerCase().includes(q));
  const inRoom = room ? new Set(room.state.seats.filter(s => !s.left).map(s => s.uid)) : new Set();

/* ── 방 채팅 ──
   화면 아래 입력칸에서 보내면, 보낸 사람 이름이 보이는 곳(대기실 자리, 점수판, 말 이름표 등)에 말풍선으로 5초 동안 뜬다.
   보내는 길: 심판 웹소켓(보낸 사람을 서버가 확인해 자리 번호를 붙인다) + Supabase 방 채널 방송(웹소켓이 없는 사람용). 같은 말은 id로 한 번만 보인다.
   기록은 남기지 않는다 */
const MPC = {seen:new Set(), bub:[], raf:0, last:0, log:[]};
const MPC_MAX = 60, MPC_MS = 5000;
function mpChatView(){   // 방 화면이 보이는 중 (관전 포함)
  if (!MP.code || !MP.room || MP.room.status === 'closed') return false;
  const ov = $('#mpOv'); if (ov && !ov.hidden) return true;
  return typeof BMV !== 'undefined' && BMV.mp && bmOpenNow();
}
function mpChatOn(){   // 관전자도 칠 수 있다
  if (!MP.code || !MP.room || MP.room.status === 'closed' || !ACC.user) return false;
  const ov = $('#mpOv'); if (ov && !ov.hidden) return true;
  return typeof BMV !== 'undefined' && BMV.mp && bmOpenNow();
}
function mpChatSync(){
  const on = mpChatOn();
  let bar = $('#mpChat');
  if (on && !bar){
    bar = document.createElement('form'); bar.id = 'mpChat'; bar.className = 'mpc-bar'; bar.autocomplete = 'off';
    bar.innerHTML = `<input id="mpChatIn" type="text" maxlength="${MPC_MAX}" enterkeyhint="send" placeholder="채팅 (${MPC_MAX}자까지)" aria-label="채팅"><button class="btn solid" type="submit">보내기</button>`;
    bar.addEventListener('submit', e => { e.preventDefault(); mpChatSend(); const i = $('#mpChatIn'); if (i) i.blur(); });   // 키보드의 엔터(파란 화살표)로 보내도 키보드를 내린다
    document.body.appendChild(bar);
  }
  if (bar) bar.hidden = !on;
  document.documentElement.classList.toggle('mpc-on', on);
  if (!mpChatView() && MPC.bub.length){ MPC.bub = []; mpBubDraw(); }
  mpLogDraw();
}
setInterval(mpChatSync, 300);
function mpChatSend(){
  const inp = $('#mpChatIn'); if (!inp) return;
  const text = inp.value.replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, MPC_MAX);
  if (!text || !MP.code || !MP.room) return;
  if (Date.now() - MPC.last < 700) return toast('조금 천천히 보내세요', true);
  MPC.last = Date.now(); inp.value = '';
  const me = mpMe(), msg = {id:Date.now().toString(36) + Math.random().toString(36).slice(2, 7), code:MP.code, seat:me, nick:me >= 0 ? MP.room.state.seats[me].nick : mpNick(), text, spec:me < 0};
  mpChatGot(msg);   // 내 말풍선은 바로
  if (MPW.ok && MPW.ws && MPW.ws.readyState === 1) try { MPW.ws.send(JSON.stringify({t:'chat', code:msg.code, id:msg.id, text, nick:msg.nick})); } catch(e){}
  try { MP.ch && MP.ch.send({type:'broadcast', event:'chat', payload:msg}); } catch(e){}
}
function mpChatGot(m){
  if (!m || typeof m.text !== 'string' || !m.id || MPC.seen.has(m.id)) return;
  MPC.seen.add(m.id); if (MPC.seen.size > 300) MPC.seen = new Set([...MPC.seen].slice(-150));
  const R = MP.room; if (!R) return;
  let seat = +m.seat;
  // 웹소켓 길은 서버가 자리를 정해 준다. 방송 길은 보낸 사람이 적은 자리라, 이름이 그 자리와 맞을 때만 그 자리로
  if (!(seat >= 0 && R.state.seats[seat] && (m.v || R.state.seats[seat].nick === m.nick))) seat = -1;
  MPC.bub = MPC.bub.filter(b => !(seat >= 0 && b.seat === seat));   // 같은 사람의 앞 말풍선은 바꾼다
  MPC.bub.push({id:m.id, seat, nick:(seat < 0 ? '👀 ' : '') + String(m.nick || '?').slice(0, 12), text:m.text.slice(0, MPC_MAX), until:Date.now() + MPC_MS});   // 관전자 말은 입력칸 위에 '👀 이름'으로
  if (MPC.bub.length > 8) MPC.bub.shift();
  MPC.log.push({id:m.id, nick:String(m.nick || '?').slice(0, 12), spec:seat < 0, me:ACC.user && m.seat >= 0 && R.state.seats[m.seat] && R.state.seats[m.seat].uid === ACC.user.id, text:m.text.slice(0, MPC_MAX), at:Date.now()});
  if (MPC.log.length > 30) MPC.log.shift();
  mpLogDraw();
  mpBubDraw();
}
// 말풍선을 붙일 이름 자리: 대기실·홀짝·블랙잭은 data-seatnm, 부루마블은 말 이름표(3D) 또는 패널, 벅샷은 이름
function mpSeatEl(i){
  const vis = el => { if (!el) return null; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight ? el : null; };
  return vis(document.querySelector(`#mpOv [data-seatnm="${i}"]`)) || vis(document.querySelector(`#bmOv .bm-tag[data-tag="${i}"]`))
    || vis(document.querySelector(`#bmOv .bm-pl[data-pl="${i}"]`)) || vis(document.querySelector(`#mpOv .bs3-tag[data-tagi="${i}"]:not([hidden])`)) || vis(document.querySelector(`#mpOv .bs-p[data-bsi="${i}"] .bs-pn`))
    || vis(document.querySelector(`#mpOv .bs-p[data-bsi="${i}"]`));
}
function mpBubDraw(){
  cancelAnimationFrame(MPC.raf);
  const now = Date.now(); MPC.bub = MPC.bub.filter(b => b.until > now);
  let lay = $('#mpBubs');
  if (!MPC.bub.length){ if (lay) lay.innerHTML = ''; return; }
  if (!lay){ lay = document.createElement('div'); lay.id = 'mpBubs'; lay.setAttribute('aria-live', 'polite'); document.body.appendChild(lay); }
  // 이미 있는 말풍선은 위치만 바꾼다 (깜빡이지 않게)
  const have = new Map([...lay.children].map(el => [el.dataset.id, el]));
  const bar = $('#mpChat'), barTop = bar && !bar.hidden ? bar.getBoundingClientRect().top : innerHeight;
  let stack = 0; const placed = [];
  for (const b of MPC.bub){
    let el = have.get(b.id); have.delete(b.id);
    if (!el){ el = document.createElement('div'); el.className = 'mpc-bub'; el.dataset.id = b.id; el.innerHTML = `<b></b><span></span>`; el.querySelector('span').textContent = b.text; lay.appendChild(el); }
    const a = b.seat >= 0 ? mpSeatEl(b.seat) : null;
    el.querySelector('b').textContent = a ? '' : b.nick;
    el.classList.toggle('free', !a);
    if (a){
      const r = a.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
      const x = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2));
      const up = r.top - h - 8 > 4;   // 위에 자리가 없으면 아래로
      let y = up ? r.top - h - 8 : r.bottom + 8;
      for (let k = 0; k < 6 && placed.some(p => x < p.x + p.w && p.x < x + w && y < p.y + p.h + 4 && p.y < y + h + 4); k++) y += up ? -(h + 4) : h + 4;   // 이름이 겹치면(말이 같은 칸) 말풍선을 쌓는다
      placed.push({x, y, w, h});
      el.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
      el.classList.toggle('dn', !up);
      el.style.setProperty('--tx', `${Math.round(Math.max(10, Math.min(w - 10, r.left + r.width / 2 - x)))}px`);
    } else { el.style.opacity = '0'; continue; }   // 이름이 화면에 없으면(관전자 등) 말풍선 없이 오른쪽 채팅 목록에만
    el.style.opacity = b.until - now < 400 ? String(Math.max(0, (b.until - now) / 400)) : '1';
  }
  have.forEach(el => el.remove());
  MPC.raf = requestAnimationFrame(mpBubDraw);
}

/* ── 판돈을 낸 뒤 답을 못 받은 요청 (방 만들기·참가·한 판 더) ──
   판돈은 요청을 보내기 전에 이 기기 통장에서 뺀다. 답이 늦거나(시간 초과) 그사이 창을 닫으면 돈이 어디로 갔는지 모르게 되므로
   여기 적어 두고, 90초가 지나면 그 방에 내 자리가 있는지 본다: 있으면 판돈은 방에 들어간 것, 없으면 돌려준다.
   심판은 60초가 넘게 늦게 도착한 방 만들기·참가 요청을 처리하지 않으므로, 돌려준 뒤에 방이 생기는 일은 없다 */
const mpPendKey = () => ACC.user ? `seed10k.mppend.${ACC.user.id}` : null;
function mpPends(){ try { return JSON.parse(localStorage.getItem(mpPendKey()) || '[]') || []; } catch(e){ return []; } }
function mpPendSave(a){ try { a.length ? localStorage.setItem(mpPendKey(), JSON.stringify(a)) : localStorage.removeItem(mpPendKey()); } catch(e){} }
function mpPendAdd(code, stake){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  mpPendSave([...mpPends(), {id, code, stake:+stake, mode:S.mode, at:Date.now()}]);
  return id;
}
function mpPendDone(id){ mpPendSave(mpPends().filter(p => p.id !== id)); }
function mpPendSeated(code){ const a = mpPends(); if (a.some(p => p.code === code)) mpPendSave(a.filter(p => p.code !== code)); }
async function mpPendCheck(){
  if (!ACC.sb || !ACC.user || MP.pendBusy) return;
  const due = mpPends().filter(p => p.mode === S.mode && Date.now() - p.at > 90000);
  if (!due.length) return;
  MP.pendBusy = true;
  try {
    for (const p of due){
      const {data:room, error} = await ACC.sb.from('seed10k_rooms').select('code,status,state').eq('code', p.code).maybeSingle();
      if (error) continue;   // 확인하지 못하면 다음에 다시
      if (!mpPends().some(x => x.id === p.id)) continue;
      if (room && room.state && (room.state.seats || []).some(s => s.uid === ACC.user.id)){   // 방에 들어가 있다 → '이어가기'로 찾을 수 있게
        mpPendDone(p.id);
        if (room.status !== 'closed' && !MP.code){ try { localStorage.setItem(mpKey(), p.code); } catch(e){} toast(`👥 방 ${p.code}에 들어가 있습니다. 도박 탭의 '이어가기'로 돌아갈 수 있습니다`); if ($('#mpCard')) $('#mpCard').innerHTML = mpCardHTML(); }
        continue;
      }
      try { if (localStorage.getItem(mpKey()) === p.code) localStorage.removeItem(mpKey()); } catch(e){}
      mpPendDone(p.id); receiveUSD(p.stake); commit();
      toast(`👥 방 ${p.code}: 서버가 처리하지 못한 판돈 ${fmtUSD(p.stake)}을 돌려받았습니다`);
    }
  } finally { MP.pendBusy = false; }
}
setInterval(() => { if (!document.hidden) mpPendCheck(); }, 20000);

/* ── 관전 ──
   진행 중인 방 목록에서 골라 자리 없이 방을 본다. 방 상태(seed10k_rooms)는 원래 누구나 읽을 수 있는 값만 담고, 숨긴 값(손에 쥔 구슬·탄 순서 등)은 심판만 안다 */
async function mpWatchList(){
  if (!ACC.user) return toast('로그인해야 합니다', true);
  const c = showModal(`<h2>👀 관전할 방</h2><div id="mpWatchL"><p class="muted">불러오는 중…</p></div><div class="acts"><button class="btn" data-close>닫기</button></div>`);
  const {data, error} = await ACC.sb.from('seed10k_rooms').select('code,game,mode,stake,il,status,state,updated_at').eq('status', 'play').order('updated_at', {ascending:false}).limit(30);
  const box = $('#mpWatchL'); if (!box) return;
  if (error){ box.innerHTML = `<p class="down">불러오지 못했습니다: ${esc(errText(error))}</p>`; return; }
  const fresh = (data || []).filter(r => Date.now() - Date.parse(r.updated_at) < 30 * 60000 && MP_GAMES[r.game]);   // 30분 넘게 멈춘 방은 뺀다
  box.innerHTML = fresh.length ? `<div class="mp-watch">${fresh.map(r => { const g = MP_GAMES[r.game];
      return `<button class="btn mp-g" data-mpwatch="${esc(r.code)}"><b>${g.ic} ${g.nm} <small class="muted">${r.mode === 'live' ? '실제 시세' : '시뮬'}${r.il ? ' · 🚨' : ''}</small></b><small>${r.state.seats.map(x => esc(x.nick)).join(' · ')} · 판돈 ${fmtUSD(r.stake)}</small></button>`; }).join('')}</div>`
    : '<p class="empty">지금 진행 중인 방이 없습니다.</p>';
  box.querySelectorAll('[data-mpwatch]').forEach(b => b.onclick = () => {
    const code = b.dataset.mpwatch; c();
    if (MP.code && MP.code !== code && !MP.spec) return toast('들어가 있는 방이 있어서 관전할 수 없습니다. 먼저 그 방에서 나가세요', true);
    mpEnter(code, true);

// 홀짝 관전: 두 사람 이름으로 (나/상대 대신)
function moeSpecHTML(R){
  const st = R.state, g = st.g || {}, seats = st.seats, nm = i => esc(seats[i] ? seats[i].nick : '?');
  const show = MP.view.oeShow && MP.view.oeShow.seq <= st.seq ? MP.view.oeShow : null, over = R.status === 'over';
  const sc = `<div class="oe-score"><span><b data-seatnm="0">${nm(0)}</b> <b class="num">${g.score ? g.score[0] : 0}</b></span><span class="muted">${over ? '끝' : `${g.round || 1}판 · 3점 먼저`}</span><span><b class="num">${g.score ? g.score[1] : 0}</b> <b data-seatnm="1">${nm(1)}</b></span></div>`;
  let hand = `<div class="oe-hand"><span class="fist">✊</span></div>`, msg;
  if (show){
    hand = `<div class="oe-hand open"><div class="oe-marbles">${Array.from({length:show.n}, (_, k) => `<i style="--d:${k * 25}ms"></i>`).join('')}</div><b class="num">${show.n}개 · ${show.n % 2 ? '홀' : '짝'}</b></div>`;
    msg = `<p class="oe-res">${nm(show.guesser)}이(가) ${show.pick === 'odd' ? '홀' : '짝'}을 골라 ${show.ok ? '맞혔다' : '틀렸다'} · ${nm(show.pt)} 1점</p>`;
  } else if (over){ hand = `<div class="oe-hand"><span class="fist">🏆</span></div>`; msg = `<p class="oe-res">${nm(g.win)} 승리 (${g.score ? g.score[g.win] + ':' + g.score[1 - g.win] : ''}${g.why && g.why !== '3점 먼저' ? ', ' + esc(g.why) : ''})</p>`; }
  else if (g.phase === 'hide') msg = `<p class="oe-res muted">${nm(g.hider)}이(가) 구슬을 쥐는 중… <span id="mpTimer"></span></p>`;
  else msg = `<p class="oe-res muted">${nm(1 - g.hider)}이(가) 홀짝을 고르는 중… <span id="mpTimer"></span></p>`;
  return `<div class="card-h"><h2>✊ 홀짝 대결</h2><small>판돈 ${fmtUSD(R.stake)}${R.il ? ' · 🚨 불법' : ''}</small></div>${sc}${hand}${msg}<div class="bm-acts"></div>`;
}

// 관전자 목록: 방 채널에 접속해 있는데 자리가 없는 사람 (나 빼고)
function mpWatchSync(ch){
  const st = ch.presenceState() || {}, R = MP.room, seated = new Set(R ? R.state.seats.map(x => x.uid) : []);
  const me = ACC.user ? ACC.user.id : '';
  const list = Object.values(st).map(a => a[a.length - 1]).filter(p => p && p.uid && p.uid !== me && !seated.has(p.uid));
  const k = list.map(p => p.uid).join(',');
  if (k === (MP.watchK || '')) return;
  const before = new Set((MP.watch || []).map(p => p.uid));
  MP.watch = list; MP.watchK = k;
  const fresh = list.filter(p => !before.has(p.uid));
  if (fresh.length && mpMe() >= 0) toast(`👀 ${fresh.map(p => p.nick).join(', ')}님이 관전을 시작했습니다`);
  mpWatchShow();
}
function mpWatchTxt(){ const w = MP.watch || []; return w.length ? ` · 👀 관전 ${w.length}명: ${w.slice(0, 3).map(p => p.nick).join(', ')}${w.length > 3 ? ' 외' : ''}` : ''; }
function mpWatchShow(){   // 방 화면 제목 줄만 고친다 (판을 다시 그리지 않게)
  const sm = document.querySelector('#mpOv:not([hidden]) .bm-ttl small');
  if (sm) sm.textContent = `${mpSpec() ? '👀 관전 중 · ' : ''}방 ${MP.code || ''} · 달러 통장 ${fmtUSD(S.usd)}${mpWatchTxt()}`;
  if (typeof BMV !== 'undefined' && BMV.mp && bmOpenNow()) bmUpdate();
}

// 화면 오른쪽 채팅 목록: 최근 6줄, 20초 지나면 흐려져 사라진다 (말풍선과 함께 보인다)
const MPC_LOG_MS = 20000;
function mpLogDraw(){
  let box = $('#mpChatLog');
  const on = mpChatView(), now = Date.now(), rows = on ? MPC.log.filter(x => now - x.at < MPC_LOG_MS).slice(-6) : [];
  if (!rows.length){ if (box) box.hidden = true; return; }
  if (!box){ box = document.createElement('div'); box.id = 'mpChatLog'; box.className = 'mpc-log'; document.body.appendChild(box); }
  box.hidden = false;
  const k = rows.map(x => x.id + (now - x.at > MPC_LOG_MS - 3000 ? 'f' : '')).join(',');
  if (box._k === k) return; box._k = k;
  box.innerHTML = rows.map(x => `<div class="mpc-l ${now - x.at > MPC_LOG_MS - 3000 ? 'fade' : ''} ${x.me ? 'me' : ''}"><b>${x.spec ? '👀 ' : ''}${esc(x.nick)}</b> ${esc(x.text)}</div>`).join('');
}
setInterval(mpLogDraw, 1000);

// 판돈 장부 열쇠: 방 코드 + 서버가 적은 시작 번호 ('판돈 냄 #3'). 번호가 없는 예전 줄은 장부에 넣지 않는다
function mpBetKey(code, note){ const m = /#(\d+)/.exec(note || ''); return code && m ? `mp:${code}:${m[1]}` : null; }
// 같이 하기 판이 시작하고 3초 뒤: 서버가 낸 '판돈 냄' 줄을 받았는지 보고, 장부에 이 판 줄이 정확히 하나인지 맞춘다
async function mpBetAudit(room, bk){
  if (!ACC.user || !ACC.sb) return;
  const nm = (MP_GAMES[room.game] || {}).nm || '같이 하기', n = room.state.startN;
  if (room.mode !== S.mode) return;   // 다른 모드 판은 그 모드 통장에서
  await mpClaim();
  if (betHas(bk)) return betAudit(bk, room.stake, nm);   // 1줄이면 그대로, 2줄 이상이면 남는 만큼 돌려준다
  // 장부에 없다: 서버 줄을 찾아본다
  const {data, error} = await ACC.sb.from('seed10k_payouts').select('id,amount,claimed_at,note').eq('user_id', ACC.user.id).eq('code', room.code).lt('amount', 0).like('note', `%#${n}`).limit(5);
  if (error) return;   // 확인하지 못하면 다음 받기 때 (서버 줄이 있으면 그때 빠진다)
  const row = (data || [])[0];
  if (row && !row.claimed_at){ await mpClaim(); if (betHas(bk)) return; }
  if (row && row.claimed_at) return;   // 다른 기기(탭)가 이미 받아 그쪽 통장에서 빠졌다
  betAudit(bk, room.stake, nm);   // 서버가 줄을 안 만들었다 → 지금 청구 (나중에 줄이 생겨도 장부에 있으니 두 번 빼지 않는다)
}

   - 멀티플레이 제한/해제, 멀티로 딴 돈 회수 SQL 만들기 (남의 저장 기록은 사이트에서 고치지 않고 SQL 편집기에서 고친다) */
const ADM = {on:false, alerts:[], unseen:0, q:'', users:null, uid:null, mode:null, data:null, ch:null};
const admT = at => at ? new Date(at).toLocaleString('ko-KR', {timeZone:'Asia/Seoul', year:'2-digit', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}) : '';
const admUSD = v => `${v < 0 ? MINUS : ''}${fmtUSD(Math.abs(v))}`;
const admR2 = v => Math.round(v * 100) / 100;

async function admCheck(){
  const was = ADM.on;
  ADM.on = false; ADM.alerts = []; ADM.unseen = 0; ADM.uid = null; ADM.data = null; ADM.users = null;
  if (ADM.ch){ try { ACC.sb.removeChannel(ADM.ch); } catch(e){} ADM.ch = null; }
  if (ACC.user && ACC.sb){
    try { const {data} = await ACC.sb.from('seed10k_admins').select('user_id').eq('user_id', ACC.user.id).maybeSingle(); ADM.on = !!data; } catch(e){}
  }
  $$('[data-tab="admin"]').forEach(b => b.hidden = !ADM.on);
  $('.tabbar').classList.toggle('adm', ADM.on);
  if (!ADM.on){ if (UI.tab === 'admin') go('home'); return; }
  try {
    ADM.ch = ACC.sb.channel('adm-alerts').on('postgres_changes', {event:'INSERT', schema:'public', table:'seed10k_alerts'}, p => {
      if (!p.new) return;
      ADM.alerts.unshift(p.new); ADM.unseen++; admBadge();
      toast(`🚨 부정행위 의심: ${p.new.msg}`, true);
      if (UI.tab === 'admin') renderAdmin();
    }).subscribe();
  } catch(e){}
  await admLoadAlerts();
  if (!was && ADM.unseen) toast(`🚨 확인하지 않은 부정행위 의심 알림 ${ADM.unseen}건`, true);
}
async function admLoadAlerts(){
  const {data, error} = await ACC.sb.from('seed10k_alerts').select('*').order('id', {ascending:false}).limit(100);
  if (!error){ ADM.alerts = data || []; ADM.unseen = ADM.alerts.filter(a => !a.seen).length; }
  admBadge();
  if (UI.tab === 'admin') renderAdmin();
}
function admBadge(){ $$('[data-tab="admin"]').forEach(b => b.classList.toggle('warn', ADM.unseen > 0)); }

      ${us}</section>

const WATCH_ADM = {cap:4000, pwMin:10, pwPct:90, oe:5, bj:5, bm:5, bsPct:80, bsMin:5, bsP:50, bsRisk:5};   // pi/mp_core.js의 WATCH와 같게
/* ── 게임 서버(라즈베리파이) 상태와 '서버 업데이트' 버튼 ──
   버튼은 seed10k_admin_cmds에 요청 한 줄을 넣는다. 파이의 pi/update.py(cron 1분마다)가 git pull + 심판 재시작을 하고 결과를 적는다.
   파이는 새 커밋이 있으면 버튼 없이도 1분 안에 알아서 받는다 */
ADM.srv = null; ADM.cmds = null;

    ACC.sb.from('seed10k_rooms').select('state,updated_at').eq('code', '__ref').maybeSingle(),
    ACC.sb.from('seed10k_admin_cmds').select('*').order('id', {ascending:false}).limit(5),
  ]);

  const el = $('#admSrv'); if (el) el.innerHTML = admSrvHTML();

    ${ADM.cmds && ADM.cmds.err ? `<p class="down">버튼을 쓰려면 SQL(supabase/seed10k_admin_cmds.sql)을 먼저 실행하세요 (${esc(ADM.cmds.err)})</p>` : ''}
    ${rows ? `<ul class="adm-cmds">${rows}</ul>` : ''}

// 멀티 누적 순획득 = 받은 돈 - 낸 판돈 (환불은 둘이 같아 0). 받음 표시된 것만 실제로 통장에 들어간 돈
function admMpNet(pays, mode){
  const ps = pays.filter(p => p.mode === mode && p.claimed_at);
  const net = admR2(ps.reduce((a, p) => a + (+p.amount || 0) - (+p.cost || 0), 0));
  const games = ps.filter(p => !/환불/.test(p.note || '')), wins = games.filter(p => (+p.amount || 0) > (+p.cost || 0));
  return {net, n:games.length, w:wins.length, pending:pays.filter(p => p.mode === mode && !p.claimed_at).length};
}

/* ───────── 복권 탭: 로또6/45 (실제 추첨 결과로 정산) · 스피또2000 (긁는 즉석복권) ─────────
   로또 규칙 출처: 동행복권 '로또6/45 소개' (1게임 1,000원, 1~45 중 6개, 판매 일~금 06:00~24:00·토 06:00~20:00, 토 20:35경 추첨,
   판매점 1인 1회 최대 10만 원, 슬립 1장 5게임, 4등 5만·5등 5천 원 고정, 1~3등은 당첨자 수로 나눔).
   세금: 동행복권 '당첨자 안내' — 200만 원 초과 3억 이하 22%, 3억 초과 33% / 토스뱅크 — 200만 원 이하 비과세. 3억을 넘는 부분만 33%로 본다.
   지급기한: 지급개시일로부터 1년 (여기서는 추첨 다음 날을 지급개시일로 본다).
   당첨번호와 등수별 1게임당 당첨금은 GitHub Actions가 동행복권에서 받아 둔 data/lotto.json을 쓴다 */
const LOT = {price:1000, perRound:100000, perSlip:5, base:1249, baseAt:Date.parse('2026-11-07T20:35:00+09:00'), week:7 * 864e5};
const lotDrawAt = r => LOT.baseAt + (r - LOT.base) * LOT.week;
function lotTax(p){   // 원천징수 세금 (원)
  if (p <= 2e6) return 0;
  return Math.round(Math.min(p, 3e8) * 0.22 + Math.max(0, p - 3e8) * 0.33);
}
// 지금 파는 회차와 판매 중인지
function lotNow(now = Date.now()){
  const k = zoneParts('Asia/Seoul', new Date(now)), dow = new Date(Date.UTC(+k.date.slice(0, 4), +k.date.slice(5, 7) - 1, +k.date.slice(8, 10))).getUTCDay();
  let r = LOT.base; while (lotDrawAt(r) - 35 * 60e3 <= now) r++;      // 그 회차의 판매 마감(추첨 35분 전, 토 20:00)이 지나면 다음 회차

/* ── 스피또2000 ──

   1등은 2매 한 세트로 발행된다(세트로 사면 20억). 한 장을 살 때마다 위 매수 ÷ 500만의 확률로 등수를 정한다(남은 매수·출고율은 따지지 않는다).
   2장 세트의 둘째 장은 첫 장이 1등이면 같이 1등, 아니면 1등이 나올 수 없다(1등은 늘 짝으로만 있으므로). 등수는 사는 순간 정해 저장하고, 긁으면 보여 준다 */
const SP = {price:2000, total:5e6, tiers:[[1e9, 1], [1e8, 3], [1e7, 25], [2e4, 13750], [4e3, 350000], [2e3, 1400000]],
  pics:['🍀', '⭐', '💎', '🍒', '🔔', '🐷', '🎁', '🌙', '🦄', '🍋']};
function spS(){ if (!S.sp || typeof S.sp !== 'object') S.sp = {tix:[]}; return S.sp; }
function spDraw(){
  let u = Math.random() * SP.total;
  for (let i = 0; i < SP.tiers.length; i++){ u -= SP.tiers[i][1]; if (u < 0) return i + 1; }
  return 0;
}
// 표면: 5게임, 게임마다 그림 2개 + 당첨금. 당첨이면 한 게임만 두 그림이 같다
function spFace(rank){
  const amts = SP.tiers.map(t => t[0]);
  const win = rank ? Math.floor(Math.random() * 5) : -1;
  return Array.from({length:5}, (_, k) => {
    const a = SP.pics[Math.floor(Math.random() * SP.pics.length)];
    let b = a; if (k !== win) while (b === a) b = SP.pics[Math.floor(Math.random() * SP.pics.length)];
    return {a, b, amt:k === win ? amts[rank - 1] : amts[Math.floor(Math.random() * amts.length)]};
  });
}
const SP_MAXBUY = 500, SP_MAXOPEN = 1000;   // SP_MAXBUY장 넘게 사면 한 장씩 저장하지 않고 '묶음'으로 산다 (등수별 장수만 저장)
// 이항분포 표본: n장 중 확률 p로 당첨되는 장수. 적으면 직접, 기댓값이 작으면 푸아송 근사, 크면 정규 근사
function spBinom(n, p){
  if (n <= 0 || p <= 0) return 0; if (p >= 1) return n;
  if (n < 2000){ let k = 0; for (let i = 0; i < n; i++) if (Math.random() < p) k++; return k; }
  const mu = n * p;
  if (mu < 30){ const L = Math.exp(-mu); let k = 0, q = Math.random(); while (q > L){ k++; q *= Math.random(); } return Math.min(k, n); }
  const sd = Math.sqrt(mu * (1 - p)), z = Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
  return Math.max(0, Math.min(n, Math.round(mu + sd * z)));
}
// 묶음 n장의 등수별 장수: 1등은 2장 세트로만 나온다(세트 ⌊n/2⌋개 중 1등 세트 수 ×2, 남는 한 장은 따로). 나머지 장은 1등을 뺀 확률로 2~6등을 차례로 나눈다
function spBig(n){
  const P = SP.tiers.map(t => t[1] / SP.total), c = [0, 0, 0, 0, 0, 0];
  const sets = Math.floor(n / 2), k1 = spBinom(sets, P[0]), odd = n % 2 && Math.random() < P[0] ? 1 : 0;
  c[0] = k1 * 2 + odd;
  let left = n - c[0], q = 1 - P[0];
  for (let i = 1; i < 6; i++){ const k = spBinom(left, P[i] / q); c[i] = k; left -= k; q -= P[i]; }
  return c;
}

function spBulkShowC(c, n, got, cost){

function spBulkShow(tix, got, cost){

/* ───────── 투자 탭: 하위 탭 · 추가 자료(금리·로또·아파트) · 채권 · 주택 ───────── */
const SUBS = [['stock', '주식'], ['bond', '채권'], ['house', '주택'], ['loan', '대출'], ['gamble', '도박'], ['lotto', '복권']];   // 대출은 따로 있던 탭을 투자 탭 안으로 옮겼다
const XD = {rates:null, lotto:null, housing:null, at:{}, err:{}};
const XD_TTL = {rates:5 * 60e3, lotto:10 * 60e3, housing:6 * 3600e3};
const YEAR_MS = 365.25 * 864e5;
async function loadExtra(name, force){
  if (!force && XD.at[name] && Date.now() - XD.at[name] < XD_TTL[name]) return XD[name];
  XD.at[name] = Date.now();
  try {
    const r = await fetch(`data/${name}.json?t=${Math.floor(Date.now() / 60000)}`, {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    XD[name] = await r.json(); XD.err[name] = null;
  } catch(e){ XD.err[name] = String(e.message || e); }
  return XD[name];
}
async function loadExtras(force){
  await Promise.all(['rates', 'lotto', 'housing'].map(n => loadExtra(n, force)));
  if (S && !S._ph && altTick()){ commit(); }
  else if (UI.tab === 'market' && UI.sub && UI.sub !== 'stock') renderMarket();
  else if (UI.tab === 'assets') renderAssets();
}
setTimeout(() => loadExtras(false), 2500);
setInterval(() => { if (!document.hidden) loadExtras(false); }, 5 * 60e3);

/* 돈 내기·받기 (원화·달러 통장). 모자라면 다른 통화에서 자동 환전한다. 마이너스통장은 쓰지 않는다 */
function canPayKRW(a){ return S.krw + Math.max(0, S.usd) * fxRates().sell >= a - 1e-6; }
function payKRW(a){
  if (ACC.tester) return true;   // 테스트 계정: 0원 처리
  if (S.krw < a){ const need = usdForKRW(a - S.krw); if (need > S.usd + 1e-9) return false; if (!exchange('u2k', need, true)) return false; }
  S.krw -= a; return true;
}
function canPayUSD(a){ return S.usd + S.krw / fxRates().buy >= a - 1e-6; }
function payUSD(a){
  if (ACC.tester) return true;   // 테스트 계정: 0원 처리
  if (S.usd < a){ const need = fxFromForTarget('k2u', a - S.usd); if (need > S.krw + 1e-9) return false; if (!exchange('k2u', need, true, true)) return false; }
  S.usd -= a; return true;
}
function altLog(k, s, amt, cur){
  (S.altLog = S.altLog || []).unshift({at:Date.now(), dt:tradeDateLabel(), k, s, amt, cur});
  if (S.altLog.length > 300) S.altLog.length = 300;
}

/* ── 채권 ──
   만기별 국채 금리(연 %, 네이버 증권)를 선형으로 이어 금리 곡선 y(t)를 만들고, 남은 현금흐름을 그 만기의 금리로 할인한다.
   가격 P = Σ CFₖ / (1 + y(tₖ)/2)^(2tₖ)   (tₖ: 지금부터 k번째 현금흐름까지의 햇수, 반기 복리)
   새로 살 때도 같은 식으로 값을 매기므로 사자마자 이익이나 손해가 생기지 않는다. 표면금리는 산 날 그 만기의 금리 */
const BOND_T = {US:[0.25, 1, 2, 5, 10, 30], KR:[1, 3, 5, 10, 20, 30]};
const bondName = (c, T) => `${c === 'US' ? '미국' : '한국'} 국채 ${T < 1 ? Math.round(T * 12) + '개월' : T + '년'}`;
function curve(c){
  const cur = XD.rates && XD.rates.cur; if (!cur) return null;
  const pts = BOND_T[c].map(T => [T, cur[c + T] ? +cur[c + T][0] : NaN]).filter(p => isFinite(p[1]));
  return pts.length >= 2 ? pts : null;
}
function yAt(c, t){
  const p = curve(c); if (!p) return null;
  if (t <= p[0][0]) return p[0][1];
  for (let i = 1; i < p.length; i++) if (t <= p[i][0]){ const [a, ya] = p[i - 1], [b, yb] = p[i]; return ya + (yb - ya) * (t - a) / (b - a); }
  return p[p.length - 1][1];
}
function bondFlows(b, now){
  if (!b.cpn) return [[(b.mat - now) / YEAR_MS, b.face, b.mat]];
  const n = Math.round(b.T * 2), out = [];
  for (let k = b.paid + 1; k <= n; k++){ const at = b.t0 + k * YEAR_MS / 2; out.push([(at - now) / YEAR_MS, b.face * b.cpn / 100 / 2 + (k === n ? b.face : 0), at]); }
  return out;
}
function bondPV(b, now = Date.now()){
  let pv = 0;
  for (const [t, a] of bondFlows(b, now)){
    if (t <= 0){ pv += a; continue; }
    const y = yAt(b.c, t); if (y === null) return null;
    pv += a / Math.pow(1 + y / 100 / 2, 2 * t);
  }
  return pv;
}
const bondVal = b => { const v = bondPV(b); if (v !== null) b.v = v; return b.v !== undefined ? b.v : b.cost; };
// 이자·만기 처리. 바뀐 것이 있으면 true
function bondTick(){
  if (!Array.isArray(S.bonds) || !S.bonds.length) return false;
  const now = Date.now(); let ch = false;
  S.bonds = S.bonds.filter(b => {
    const credit = a => { if (b.c === 'US') receiveUSD(a); else S.krw += a; };
    if (b.cpn){
      const n = Math.round(b.T * 2);
      while (b.paid < n && b.t0 + (b.paid + 1) * YEAR_MS / 2 <= now){
        b.paid++; const c = b.face * b.cpn / 100 / 2; credit(c); ch = true;
        altLog('bond', `${bondName(b.c, b.T)} 이자 (${b.paid}/${n}회)`, c, b.c === 'US' ? 'USD' : 'KRW');
      }
      if (b.paid >= n){ credit(b.face); altLog('bond', `${bondName(b.c, b.T)} 만기 원금`, b.face, b.c === 'US' ? 'USD' : 'KRW'); toast(`${bondName(b.c, b.T)}이 만기되어 원금이 들어왔습니다`); return false; }
      return true;
    }
    if (b.mat <= now){ credit(b.face); ch = true; altLog('bond', `${bondName(b.c, b.T)} 만기 (액면)`, b.face, b.c === 'US' ? 'USD' : 'KRW'); toast(`${bondName(b.c, b.T)}이 만기되었습니다`); return false; }
    return true;
  });
  return ch;
}
function bondBuy(c, T, amt){
  if (!isLive()) return toast('채권은 실제 시세 모드에서만 살 수 있습니다', true);
  if (S.over) return toast('파산해서 거래할 수 없습니다', true);

/* ───── 상점 (게임 안의 달러로 산다) ─────
   전과 지우기 $500 · 변호사 선임 $300 · 잠수 $300 · 선수권 $200 · 닉네임 색 $300 (+ 부루마블 말 스킨 뽑기)
   - 전과 지우기·닉네임 색은 남들도 보는 것이라 서버 함수(seed10k_shop_redeem)가 준다: 서버는 방금 생긴 돈 기록 'shop:<아이템>'(−가격)이 있어야만 효과를 준다
   - 변호사·잠수·선수권은 내 기록(S.gam.shop.inv)에 개수로 쌓였다가 쓸 때 하나씩 줄어든다

const SHOP = [
  {id:'record', ic:'🧽', nm:'전과 지우기', price:500, d:'경찰 단속 기록(전과)을 1회 지웁니다. 0회가 되면 랭킹의 빨간 줄도 사라지고, 낮아졌던 최고 신용등급과 적발 확률도 되돌아옵니다.', server:true},
  {id:'lawyer', ic:'⚖️', nm:'변호사 선임', price:300, d:'다음 경찰 단속(불법 모드 단속·도주 적발) 한 번은 압수액이 절반이 됩니다.'},
  {id:'dive', ic:'🤿', nm:'잠수', price:300, d:''},   // 설명은 shopDesc (RUN.p를 쓰므로)
  {id:'first', ic:'🥇', nm:'선수권', price:200, d:'혼자 하는 벅샷 룰렛·부루마블을 시작할 때 쓰면 내 차례부터 시작합니다.'},
  {id:'skin', ic:'🎲', nm:'부루마블 말 스킨 뽑기', price:300, d:'말 스킨 10종 중 아직 없는 것 하나가 나옵니다 (헬리콥터·비행기는 날아다닙니다). 도박 탭 부루마블 칸의 🎨 말 스킨 버튼으로 바꿔 씁니다 (게임 밖에서).'},
];
const DIVE_P = 0.08;
function shopS(){ const G = gamS(); if (!G.shop || typeof G.shop !== 'object') G.shop = {}; const s = G.shop; if (!s.inv || typeof s.inv !== 'object') s.inv = {}; if (!Array.isArray(s.pend)) s.pend = []; return s; }
const shopN = id => Math.max(0, +(shopS().inv[id] || 0));
function shopUse(id){ const s = shopS(); if (!(s.inv[id] > 0)) return false; s.inv[id]--; return true; }
const shopItem = id => SHOP.find(x => x.id === id) || (id === 'color' ? {id:'color', ic:'🎨', nm:'닉네임 색 변경', price:300, server:true} : null);

// 값 내기: 다른 돈 변화는 먼저 따로 적고, 환전도 따로 적은 뒤, 상점 결제만 한 줄(why = shop:<id>, 정확히 −가격)로 남긴다
function shopPay(id){
  const it = shopItem(id); if (!it) return false;
  if (!canPayUSD(it.price)){ toast(`달러·원화 통장을 합쳐 ${fmtUSD(it.price)}이 있어야 합니다`, true); return false; }
  lgTrack();
  if (!ACC.tester && S.usd < it.price){
    const need = fxFromForTarget('k2u', it.price - S.usd);
    if (need > S.krw + 1e-9 || !exchange('k2u', need, true, true)){ toast('환전하지 못했습니다', true); return false; }
    lgTrack('fx:shop');

// 서버가 주는 아이템: 결제 기록을 먼저 올리고 서버 함수를 부른다. 연결이 끊기면 기다리는 목록(pend)에 두고 다음에 다시
async function shopRedeem(item, arg){
  const s = shopS(), job = {item, arg:arg || null, at:Date.now()};
  s.pend.push(job); save();
  return shopFlush();
}
async function shopFlush(){
  const s = shopS(); if (!s.pend.length || !ACC.sb || !ACC.user) return null;
  await lgFlush();
  let last = null;
  for (const job of s.pend.slice()){
    let r = null;
    try { const {data, error} = await ACC.sb.rpc('seed10k_shop_redeem', {item:job.item, arg:job.arg}); if (error) throw error; r = data; } catch(e){ return null; }   // 연결 문제: 다음에 다시
    s.pend = s.pend.filter(x => x !== job);
    if (r && r.ok){
      last = r;
      if (job.item === 'record'){ const G = gamS(); G.bust = Math.max(0, (G.bust || 0) - 1); if (ACC.busted instanceof Map){ if (r.left > 0) ACC.busted.set(ACC.user.id, r.left); else ACC.busted.delete(ACC.user.id); } toast(r.left > 0 ? `전과를 1회 지웠습니다 (남은 전과 ${r.left}회)` : '전과를 모두 지웠습니다. 빨간 줄이 사라졌습니다'); }
      if (job.item === 'color'){ ACC.ncol = ACC.ncol instanceof Map ? ACC.ncol : new Map(); ACC.ncol.set(ACC.user.id, r.color); toast('닉네임 색을 바꿨습니다'); }
    } else {   // 서버가 거절: 낸 돈을 돌려준다
      const it = shopItem(job.item);
      if (it && !ACC.tester){ receiveUSD(it.price); altLog('shop', `🛒 ${it.nm} 실패로 환불${r && r.err ? ` (${r.err})` : ''}`, it.price, 'USD'); }
      toast(`${it ? it.nm : '상점'}: ${(r && r.err) || '처리하지 못했습니다'}${it && !ACC.tester ? ' — 환불했습니다' : ''}`, true);
    }
  }
  commit(); render();
  if (typeof renderRankCard === 'function') renderRankCard();
  shopDraw(); renderShopCard();
  return last;
}

}
function shopDraw(){
  const box = $('#shopBox'); if (!box) return;
  const it = SHOPV.ask && shopItem(SHOPV.ask);
  box.innerHTML = it ? `<div class="shop-ask"><span class="shop-ic big">${it.ic}</span><b>${it.nm}</b><p class="muted" style="margin:6px 0 0">${shopDesc(it)}</p>
      <div class="acts"><button class="btn" id="shopBack">뒤로</button><button class="btn solid" id="shopGo">${fmtUSDn(it.price, 0)} 내고 사기</button></div></div>` : shopListHTML();
  const bk = $('#shopBack'); if (bk) bk.onclick = () => { SHOPV.ask = null; shopDraw(); };

function shopOpen(){

  showModal(`<h2>🛒 상점</h2><p class="muted" style="margin:0 0 10px">게임 안의 달러로 삽니다</p><div id="shopBox"></div><div class="acts"><button class="btn" data-close>닫기</button></div>`, () => { SHOPV.ask = null; renderShopCard(); });

}
function shopBuy(id){   // 목록에서 누름 → 같은 창에서 확인 화면
  const it = shopItem(id); if (!it) return;
  if (S.over) return toast('파산해서 살 수 없습니다', true);
  if (id === 'record' && !(gamS().bust > 0)) return toast('지울 전과가 없습니다', true);
  if (id === 'skin' && bmSkinOwn().length >= BM_SKINS.length) return toast('스킨을 모두 모았습니다', true);
  if (it.server && !ACC.user) return toast('로그인해야 살 수 있습니다', true);

}
async function shopBuyNow(id){
  const it = shopItem(id); if (!it) return;
  SHOPV.ask = null;
  if (!shopPay(id)){ shopDraw(); return; }
  if (it.server){ shopDraw(); await shopRedeem(id); }
  else if (id === 'skin'){ await bmSkinDraw(); }   // 뽑기 결과 창으로 바뀐다
  else { const s = shopS(); s.inv[id] = shopN(id) + 1; commit(); toast(`${it.nm}을(를) 샀습니다 (가진 것 ${shopN(id)}개)`); }

// 찍기: 판을 보는 각도(내려다보는 각 el, 모형을 돌린 각 yaw)로 정사각 그림 (투명 배경)
function bmSkinShoot(T, id, opt){
  const W = (opt && opt.w) || 256, H = (opt && opt.h) || 320, frames = (bmSkin(id) || {}).frames || 1;
  const R = new T.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true}); R.setSize(W, H, false); R.setPixelRatio(1);
  R.outputColorSpace = T.SRGBColorSpace; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
  // 반사용 환경: 밝은 판 몇 장이 있는 방 (외부 그림 없이)
  const room = new T.Scene(); room.add(new T.Mesh(new T.BoxGeometry(10, 10, 10), new T.MeshBasicMaterial({color:'#6b7380', side:T.BackSide})));
  for (const [x, y, z, s, c] of [[0, 4.9, 0, 6, '#ffffff'], [4.9, 1, 0, 3, '#fff3dc'], [-4.9, 2, 1, 3, '#dfe9ff'], [0, 1, 4.9, 4, '#ffffff'], [0, -4.9, 0, 4, '#3a3f48'], [0, 2, -4.9, 3, '#cfd8e6']]){ const p = new T.Mesh(new T.PlaneGeometry(s, s), new T.MeshBasicMaterial({color:c, side:T.DoubleSide})); p.position.set(x, y, z); p.lookAt(0, 0, 0); room.add(p); }
  const pm = new T.PMREMGenerator(R), env = pm.fromScene(room, 0.03).texture;
  const strip = document.createElement('canvas'); strip.width = W * frames; strip.height = H; const sx = strip.getContext('2d');
  for (let k = 0; k < frames; k++){
    const S = new T.Scene(); S.environment = env;
    S.add(new T.HemisphereLight('#ffffff', '#5a4a3a', 0.6));
    const L = new T.DirectionalLight('#ffffff', 2.2); L.position.set(2, 4, 2.5); S.add(L);
    const m = bmSkinModel(T, id, k / frames, opt && opt.tint); m.rotation.y += (opt && opt.yaw !== undefined) ? opt.yaw : -0.7; S.add(m);
    const box = new T.Box3().setFromObject(m), c = box.getCenter(new T.Vector3()), sz = box.getSize(new T.Vector3());
    const el = (opt && opt.el !== undefined) ? opt.el : 0.75, cam = new T.PerspectiveCamera(24, W / H, 0.1, 50), d = Math.max(sz.x, sz.y * 1.1, sz.z) * 2.95;
    cam.position.set(0, c.y + Math.sin(el) * d, Math.cos(el) * d); cam.lookAt(0, c.y, 0); cam.updateMatrixWorld(true);
    // 바닥(모형의 가장 낮은 점)이 그림의 같은 높이(위에서 75%)에 오게 화면을 위아래로 민다 → 판 위에서 모든 스킨이 칸에 딛고 선다
    const y0 = new T.Vector3(0, box.min.y, 0).project(cam).y, yd = -0.5;
    cam.setViewOffset(W, H, 0, (yd - y0) * H / 2, W, H);
    R.render(S, cam); sx.drawImage(R.domElement, k * W, 0);
    S.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }
  pm.dispose(); R.dispose();
  return {url:strip.toDataURL('image/png'), n:frames};
}

function groupNum(raw){
  const [i, f] = String(raw ?? '').split('.');
  const g = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return f === undefined ? g : g + '.' + f;

/* 입력칸 el의 값을 정리해 쉼표를 넣고, 커서를 같은 숫자 뒤에 둔다. 쉼표 없는 값을 돌려준다.
   dec: 소수점 허용(달러, 소수 둘째 자리까지) */
function commaInput(el, dec, ev){
  const v = el.value, pos = el.selectionStart ?? v.length;
  const keep = ch => /[0-9]/.test(ch) || (dec && ch === '.');
  let before = [...v.slice(0, pos)].filter(keep).length;   // 커서 앞에 있던 숫자(와 소수점) 개수
  let raw = [...v].filter(keep).join('');
  // 쉼표만 지워졌으면(지우기 키가 쉼표에 걸림) 그 옆 숫자를 대신 지운다
  const prev = el.dataset.raw ?? null, it = ev && ev.inputType;
  if (prev !== null && raw === prev && it === 'deleteContentBackward' && before > 0){ raw = raw.slice(0, before - 1) + raw.slice(before); before--; }
  else if (prev !== null && raw === prev && it === 'deleteContentForward' && before < raw.length){ raw = raw.slice(0, before) + raw.slice(before + 1); }
  if (dec){ const k = raw.indexOf('.'); if (k >= 0) raw = raw.slice(0, k + 1) + raw.slice(k + 1).replace(/\./g, '').slice(0, 2); }
  raw = raw.replace(/^0+(?=\d)/, '');
  const shown = groupNum(raw);
  if (shown !== v){
    el.value = shown;
    let n = 0, c = 0;
    while (c < shown.length && n < Math.min(before, raw.length)){ if (shown[c] !== ',') n++; c++; }
    try { el.setSelectionRange(c, c); } catch(e){}
  }
  el.dataset.raw = raw;
  return raw;
}

/* 받을 금액 T를 정하면, 그만큼 받는 데 필요한 가장 작은 '낼 금액'
   원화 → 달러: 받는 달러 = floor(A ÷ 달러 살 때 환율 × 100) ÷ 100 이 T 이상이 되는 가장 작은 원화 A(1원 단위)
   달러 → 원화: 받는 원화 = floor(D × 달러 팔 때 환율) 이 T 이상이 되는 가장 작은 달러 D(0.01달러 단위) */
function fxFromForTarget(dir, T){
  if (!(T > 0)) return 0;
  const r = fxRates();
  if (dir === 'k2u'){
    T = Math.round(T * 100) / 100;
    let A = Math.max(1, Math.ceil(T * r.buy - 1e-7));
    while (exQuote('k2u', A).to < T - 1e-9) A++;
    return A;
  }
  T = Math.floor(T);
  let D = Math.max(0.01, Math.ceil(T / r.sell * 100 - 1e-7) / 100);
  while (exQuote('u2k', D).to < T) D = Math.round((D + 0.01) * 100) / 100;
  return D;
}

/* ───────── 계정 (Supabase) ───────── */
const ACC = {sb:null, user:null, nick:'', ready:false, err:null, loadedFor:undefined, cloudT:null, rankT:null,
             lastSync:null, syncErrAt:0, ranks:{}, ranksAt:{}, myRank:{}, gateMode:'login', busy:false,
             ver:0, pushing:false, pushAgain:false};
function isGuestSession(){ try { return sessionStorage.getItem(GUEST_KEY) === '1'; } catch(e){ return false; } }
function setGuestSession(v){ try { v ? sessionStorage.setItem(GUEST_KEY, '1') : sessionStorage.removeItem(GUEST_KEY); } catch(e){} }

/* 이 기기에서 로그인했던 계정들 (빠른 전환용). 지금 계정의 로그인 토큰은 Supabase가 이미 이 기기 저장소에 두므로,
   같은 저장소에 다른 계정들의 토큰도 두고 setSession으로 바꿔 낀다. 비밀번호는 저장하지 않는다. */
const ACCTS_KEY = 'seed10k.accounts.v1', ACCTS_MAX = 5;
function acctList(){ try { const a = JSON.parse(localStorage.getItem(ACCTS_KEY)); return Array.isArray(a) ? a.filter(x => x && x.id && x.rt) : []; } catch(e){ return []; } }
function acctStore(a){ try { localStorage.setItem(ACCTS_KEY, JSON.stringify(a.slice(0, ACCTS_MAX))); } catch(e){} }
function acctRemember(session){
  if (!session || !session.user || !session.refresh_token) return;
  const u = session.user, list = acctList(), old = list.find(x => x.id === u.id);
  const row = {id:u.id, email:u.email || (old && old.email) || '', nick:(u.user_metadata && u.user_metadata.nickname) || (old && old.nick) || '',
               at:session.access_token, rt:session.refresh_token};
  acctStore([row, ...list.filter(x => x.id !== u.id)]);
}
function acctForget(id){ acctStore(acctList().filter(x => x.id !== id)); }
const acctOthers = () => acctList().filter(x => !ACC.user || x.id !== ACC.user.id);
async function leaveAccount(){   // 지금 계정의 기록을 서버에 올리고, 최신 토큰을 목록에 남긴다
  if (!ACC.user) return;
  save(); clearTimeout(ACC.cloudT);
  try { await pushCloud(); await pushRank(); } catch(e){}
  try { const {data} = await ACC.sb.auth.getSession(); acctRemember(data && data.session); } catch(e){}
}
const isMidFlight = e => !!e && (e.status === 409 || /mid-flight|discarded/i.test(e.message || ''));
const isDeadToken = e => !!e && /refresh token|not found|invalid|expired|revoked|session_not_found|already used/i.test(`${e.code || ''} ${e.message || ''}`);
async function switchAccount(id){
  if (!ACC.sb || ACC.busy || (ACC.user && ACC.user.id === id)) return;
  const t = acctList().find(x => x.id === id); if (!t) return;
  ACC.busy = true;
  try {
    await leaveAccount();
    let {error} = await ACC.sb.auth.setSession({access_token:t.at, refresh_token:t.rt});
    // 다른 탭이 같은 때 로그인 정보를 바꾸면 supabase-js가 받은 새 토큰을 버리고 409(mid-flight)를 낸다.
    // 토큰이 잘못된 게 아니므로 잠깐 뒤 다시 시도한다 (같은 토큰은 10초 안에는 다시 써도 같은 결과를 준다)
    for (let k = 0; k < 2 && error && isMidFlight(error); k++){
      await new Promise(r => setTimeout(r, 400 + 400 * k));
      const {data} = await ACC.sb.auth.getSession();
      if (data && data.session && data.session.user.id === id){ error = null; break; }
      ({error} = await ACC.sb.auth.setSession({access_token:t.at, refresh_token:t.rt}));
    }
    if (error){
      console.warn('[seed10k] 계정 전환 실패', error);
      if (isMidFlight(error) || !isDeadToken(error)){   // 토큰 문제가 아니면 목록에서 지우지 않는다
        toast(`${t.nick || t.email} 계정으로 바꾸지 못했습니다. 이 사이트가 열린 다른 탭을 닫고 다시 눌러 보세요 (${errText(error)})`, true);
        return;
      }
      acctForget(id);
      toast(`${t.nick || t.email} 계정은 로그인이 만료되어 다시 로그인해야 합니다 (${errText(error)})`, true);
      if (ACC.user) renderTab();
      openGate(true); $('#gEmail').value = t.email; $('#gPw').value = '';
      return;
    }
    toast(`${t.nick || t.email} 계정으로 바꿨습니다`);
  } catch(e){ console.error('[seed10k] 계정 전환 오류', e); toast(`계정을 바꾸지 못했습니다 (${errText(e)})`, true); }
  finally { ACC.busy = false; }
}
function acctListHTML(btnCls){
  return acctOthers().map(a => `<button class="${btnCls}" data-acct="${esc(a.id)}"><b>${esc(a.nick || a.email)}</b>${a.nick ? `<small>${esc(a.email)}</small>` : ''}</button>`).join('');
}
function initAccount(){
  if (!window.supabase || !window.supabase.createClient){
    ACC.err = '로그인 서버에 연결하지 못했습니다. 인터넷 연결을 확인하거나 로그인 없이 하세요.';
    ACC.ready = true; afterAuthResolved(); return;
  }
  try { ACC.sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{storage:SB_STORE}}); }
  catch(e){ ACC.err = '로그인 서버 설정이 올바르지 않습니다.'; ACC.ready = true; afterAuthResolved(); return; }
  ACC.sb.auth.onAuthStateChange((ev, session) => { if (ev === 'PASSWORD_RECOVERY') setTimeout(pwRecoverDialog, 600); handleSession(session); });
  ACC.sb.auth.getSession().then(({data}) => handleSession(data && data.session)).catch(() => { ACC.ready = true; afterAuthResolved(); });
}
async function handleSession(session){
  const u = session ? session.user : null, newId = u ? u.id : null;
  ACC.ready = true;
  acctRemember(session);   // 토큰이 갱신될 때마다 목록의 토큰도 최신으로
  if (ACC.loadedFor === newId){ ACC.user = u; if (u) ACC.nick = (u.user_metadata && u.user_metadata.nickname) || ACC.nick; whoUpdate(); return; }
  // 계정이 바뀌었다 (로그인, 로그아웃, 다른 탭에서 계정 전환)
  clearTimeout(ACC.cloudT); clearTimeout(ACC.rankT);
  ACC.loadedFor = newId;
  ACC.user = u;
  ACC.nick = u && u.user_metadata && u.user_metadata.nickname || '';
  ACC.ranks = {}; ACC.ranksAt = {}; ACC.myRank = {};
  stopAuto();
  if (UI.sheet) closeSheet();
  bmHide(); slHide(); gmHide();
  // 검색어는 계정마다 따로 — 바뀐 계정에서는 비운다 (입력칸과 필터가 어긋나지 않게 둘 다)
  UI.q = ''; UI.qRaw = ''; { const q = $('#q'); if (q){ q.value = ''; const c = $('#qClear'); if (c) c.hidden = true; } }
  if (u){
    setGuestSession(false);
    renderGate();   // 로그인됐으니 로그인 화면부터 닫는다 (기록 옮기기 질문이 가려지지 않게)
    if (SET.mode){ S = await loadAccountMode(SET.mode); writeLocal(); lgTrack(); if (S.dirty) scheduleCloud(); }
    else { S = newGame('sim'); S._ph = true; }
  } else {
    S = load(SET.mode === 'live' ? 'live' : 'sim');
    if (!SET.mode) S._ph = true;
  }
  $$('.view').forEach(v => { delete v.dataset.built; });
  if (S.mode === 'live') startLivePolling(); else stopLivePolling();
  go(UI.tab); renderHeader();
  afterAuthResolved();
  whoUpdate();
  mpReset(); if (ACC.user) mpWatchPayouts();

/* 이 기기 기록(local)과 서버 기록(cloud) 중 이어서 할 것을 고른다.
   - local이 서버 표지를 가진 새 형식이면: 서버에 올리지 못한 변경이 있고(dirty) 그 변경이 지금 서버 기록 위에서
     이뤄졌을 때(표지가 같을 때)만 local, 그 밖에는 cloud. 다른 기기가 그 사이 올린 기록을 덮어쓰지 않기 위해서다.
   - local이 서버에 한 번도 올라가지 못한 기록이면(표지 없음, 예전 형식 포함): 진행한 쪽(매매·대출·시뮬레이션 날짜가 있는 쪽)을 고르고, 둘 다 진행했거나
     둘 다 아니면 나중에 저장된 쪽을 고른다. 예전 버전이 빈 기록으로 서버를 덮어쓴 경우를 되살리기 위해서다. */
function chooseSave(local, cloud){
  if (!local) return cloud;
  if (!cloud) return local;
  if (local.syncBase != null){   // 서버에 한 번이라도 올라간 기록
    return (local.dirty && (local.syncBase ?? null) === (cloud.syncBase ?? null)) ? local : cloud;
  }
  const lp = hasProgress(local), cp = hasProgress(cloud);
  const useLocal = lp !== cp ? lp : (local.savedAt || 0) > (cloud.savedAt || 0);
  if (!useLocal) return cloud;
  local.syncBase = cloud.syncBase ?? null; local.dirty = true;   // 서버의 지금 기록을 이어받은 것으로 올린다
  return local;
}
/* 서버 기록이 이 기기와 달라졌을 때(다른 기기에서 진행) 서버 기록으로 바꾼다. */
async function adoptCloud(mode, msg){
  if (!ACC.user || !ACC.sb || !S || S.mode !== mode) return;
  const uid = ACC.user.id;
  let cloud;
  try {
    const {data, error} = await ACC.sb.from('seed10k_saves').select('data').eq('user_id', uid).eq('mode', mode).maybeSingle();
    if (error) throw error;
    cloud = data ? validSave(data.data, mode) : null;
  } catch(e){ return; }
  if (!cloud || !ACC.user || ACC.user.id !== uid || S.mode !== mode) return;
  // 빈 기록이, 서버에 아직 못 올린 이 기기의 진행 기록을 덮으려 하면 이 기기 쪽을 지킨다
  // (예전 버전이 올린 빈 기록이거나, 서버 표가 없던 동안 다른 기기가 먼저 올린 빈 기록)
  if ((cloud.syncBase === undefined || S.syncBase == null) && hasProgress(S) && !hasProgress(cloud)){
    S.syncBase = cloud.syncBase ?? null; S.dirty = true; writeLocal(); scheduleCloud(); return;
  }
  stopAuto();
  if (UI.sheet) closeSheet();
  S = cloud; S.dirty = false; writeLocal(); lgTrack();

  go(UI.tab); renderHeader();

}

/* 서버 오류를 사용자에게 보여줄 짧은 글로 (코드, HTTP 상태, 메시지) */
function errText(e){
  if (!e) return '알 수 없는 오류';
  if (e.code === 'PGRST205' || e.code === '42P01' || /schema cache|does not exist/i.test(e.message || '')) return '서버에 저장용 표가 없음. Supabase에서 seed10k.sql 실행 필요';
  if (e.code === '42501') return '로그인 세션과 계정이 맞지 않아 서버가 거절함. 다시 로그인하면 올라갑니다';
  const parts = [e.code, e.status, e.message || e.error_description || (typeof e === 'string' ? e : '')].filter(x => x !== undefined && x !== null && x !== '');
  return (parts.join(' ') || String(e)).slice(0, 160);
}

/* 서버에 올린다. 서버 기록의 표지가 이 기록이 이어받은 표지와 같을 때만 바꾼다(조건부 갱신).

/* 이 탭의 Supabase 세션(이 기기 저장소에 하나뿐)이 화면의 계정과 같은지 본다. 다른 탭에서 계정을 바꿨는데

async function pushCloud(){
  if (!ACC.user || !ACC.sb || !S || S._ph) return;
  if (ACC.pushing){ ACC.pushAgain = true; return; }
  ACC.pushing = true;
  // 돈 기록을 먼저 올린다. 올리는 동안(await)에도 게임에서 딴 돈이 들어올 수 있으므로, 기록이 다 올라가 '바뀐 게 없다'가 확인될 때까지 반복하고
  // 그 직후(기다림 없이) 저장할 내용을 찍는다 → 저장 잔고와 마지막 기록이 항상 같다 (전에는 그 사이 들어온 상금 때문에 '저장 잔고 불일치'가 잘못 떴다)
  for (let k = 0; ; k++){
    lgTrack();
    if (!lgQ().length || ACC.tester || !ACC.testerKnown) break;
    const s0 = LG.sent || 0;
    if (k >= 4 || !(await lgFlush())){ ACC.pushing = false; scheduleCloud(); return; }
    if ((LG.sent || 0) === s0) break;   // 서버가 받지 않는 오류(네트워크 아님)면 저장까지 막지는 않는다
  }
  const uid = ACC.user.id, snap = S, mode = snap.mode, base = snap.syncBase ?? null, ver = ACC.ver;
  const token = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const data = JSON.parse(JSON.stringify(snap)); data.syncBase = token; data.dirty = false; delete data._ph;
  const row = {data, updated_at:new Date().toISOString()};
  let conflict = false;
  // 이 탭의 로그인 세션이 화면의 계정과 같은지 먼저 확인한다. 다르면 남의 세션으로 이 계정 기록을 쓰려다
  // 권한 규칙(RLS)에 막히므로 올리지 않고, 실제 로그인 상태로 화면을 맞춘다 (이 계정 기록은 이 기기에 남아 있다)
  if (!(await sessionMatches())){ ACC.pushing = false; return; }
  const attempt = async () => {
    let q = ACC.sb.from('seed10k_saves').update(row).eq('user_id', uid).eq('mode', mode);
    q = base === null ? q.is('data->>syncBase', null) : q.eq('data->>syncBase', base);
    const {data:upd, error} = await q.select('user_id');
    if (error) throw error;
    if (upd && upd.length) return 'ok';
    const ins = await ACC.sb.from('seed10k_saves').insert({user_id:uid, mode, ...row});
    if (!ins.error) return 'ok';
    if (ins.error.code === '23505') return 'conflict';   // 서버에 다른 기기의 기록이 있다
    throw ins.error;
  };
  try {
    let r;
    try { r = await attempt(); }
    catch(e){
      // 로그인 토큰이 만료됐거나 권한 규칙에 막혔으면 토큰을 새로 받아, 같은 계정일 때만 한 번 더 시도한다
      if (!isAuthErr(e) && e.code !== '42501') throw e;
      const {data:rd, error:re} = await ACC.sb.auth.refreshSession();
      if (re || !rd || !rd.session || rd.session.user.id !== uid) throw e;
      r = await attempt();
    }
    if (r === 'conflict') conflict = true;
    else {
      ACC.lastSync = new Date(); ACC.syncErr = null;
      if (S === snap){ S.syncBase = token; if (ACC.ver === ver) S.dirty = false; writeLocal(); pushRank(); }
    }
  } catch(e){
    ACC.syncErr = {at:new Date(), text:errText(e)};
    console.error('[seed10k] 서버 저장 실패', e);
    // 같은 오류는 한 번만 알린다 (10분이 지나면 다시). 그 뒤로는 규칙·설정의 계정 칸에만 보인다
    if (ACC.syncErrShown !== ACC.syncErr.text || Date.now() - ACC.syncErrAt > 600000){ ACC.syncErrShown = ACC.syncErr.text; ACC.syncErrAt = Date.now(); toast(`서버에 저장하지 못했습니다 (${ACC.syncErr.text}). 이 기기에는 저장돼 있습니다`, true); }
  } finally {

  if (ACC.pushAgain){ ACC.pushAgain = false; scheduleCloud(); }
}

function openGate(adding){ if (!ACC.user) setGuestSession(false); ACC.gateMode = 'login'; ACC.gateAdd = !!(adding && ACC.user); gateMsg(''); renderGate(true); }
function renderGate(forceOpen){
  const gate = $('#gate');
  if (!forceOpen) ACC.gateAdd = false;
  const show = forceOpen || (!ACC.user && (!ACC.ready || !isGuestSession()));
  gate.hidden = !show;
  document.documentElement.classList.toggle('gated', show);
  if (!show) return;
  const signup = ACC.gateMode === 'signup';
  $('#gateTitle').textContent = !ACC.ready ? '계정 확인 중' : signup ? '회원가입' : '로그인';
  $('#gateForm').hidden = !ACC.ready || !ACC.sb;
  $('#gPw2').hidden = !signup; $('#gNick').hidden = !signup;
  $('#gPw').setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
  $('#gSubmit').textContent = signup ? '회원가입' : '로그인';
  $('#gForgotRow').hidden = signup;
  $('#gSwitchText').textContent = signup ? '이미 계정이 있나요?' : '계정이 없나요?';
  $('#gSwitch').textContent = signup ? '로그인' : '회원가입';
  // 이 기기에서 로그인했던 다른 계정: 누르면 바로 그 계정으로
  const others = ACC.ready && ACC.sb ? acctOthers() : [];
  $('#gAccts').hidden = !others.length || signup;
  $('#gAccts').innerHTML = others.length ? `<div class="g-acc-h">이 기기에서 로그인했던 계정</div>${acctListHTML('g-acc')}<div class="g-acc-or">또는 다른 계정으로 로그인</div>` : '';
  $('#gGuestHint').hidden = ACC.gateAdd;
  $('#gGuest').textContent = ACC.gateAdd ? '취소' : '로그인 없이 하기';
  if (ACC.err) gateMsg(ACC.err, true);
}
function gateMsg(t, bad){ const m = $('#gMsg'); m.textContent = t || ''; m.classList.toggle('bad', !!bad); }
async function gateSubmit(){
  if (!ACC.sb || ACC.busy) return;
  const email = $('#gEmail').value.trim(), pw = $('#gPw').value;
  if (!email || pw.length < 6) return gateMsg('이메일과 6자 이상 비밀번호를 입력하세요.', true);
  const signup = ACC.gateMode === 'signup';
  if (signup){
    if (pw !== $('#gPw2').value) return gateMsg('비밀번호가 서로 다릅니다.', true);
    const nick = $('#gNick').value.trim();
    if (nick && (nick.length < 2 || nick.length > 12)) return gateMsg('닉네임은 2~12자로 정하거나 비워 두세요.', true);
  }
  ACC.busy = true; $('#gSubmit').disabled = true;
  try {
    if (ACC.user) await leaveAccount();   // 계정 추가: 지금 계정 기록부터 올려 둔다 (로그아웃하지 않으므로 이 계정 토큰은 계속 쓸 수 있다)
    if (signup){
      gateMsg('가입하는 중입니다.');
      const nick = $('#gNick').value.trim();
      const {data, error} = await ACC.sb.auth.signUp({email, password:pw, options:{emailRedirectTo:location.origin + location.pathname, data:nick ? {nickname:nick} : {}}});
      if (error) return gateMsg('가입하지 못했습니다: ' + error.message, true);
      if (!(data && data.session)){   // 이메일 인증을 켜 두면 세션 없이 돌아온다 → 메일의 코드(또는 링크)로 확인
        ACC.gateMode = 'login'; renderGate(true);
        gateMsg(`가입했습니다. ${email}로 보낸 인증 메일의 코드를 입력하세요. (메일의 링크를 눌러도 됩니다)`);
        return signupCodeDialog(email);
      }
    } else {
      gateMsg('로그인하는 중입니다.');
      const {error} = await ACC.sb.auth.signInWithPassword({email, password:pw});
      if (error && /not confirmed/i.test(error.message || '')){ gateMsg('아직 이메일 인증을 하지 않은 계정입니다. 메일의 코드를 입력하세요.', true); return signupCodeDialog(email); }
      if (error) return gateMsg('로그인하지 못했습니다: ' + (error.message === 'Invalid login credentials' ? '이메일이나 비밀번호가 맞지 않습니다.' : error.message), true);
    }
    gateMsg(''); $('#gPw').value = ''; $('#gPw2').value = '';
  } catch(e){
    console.error('[seed10k] 로그인 오류', e);
    gateMsg(`로그인하지 못했습니다: ${/quota/i.test(String(e && (e.name + e.message))) ? '이 기기 저장 공간이 가득 찼습니다.' : errText(e)}`, true);
  } finally { ACC.busy = false; $('#gSubmit').disabled = false; }
}
$('#gSubmit').addEventListener('click', gateSubmit);
// 비밀번호 찾기: 가입한 메일로 재설정 링크를 보낸다 (Supabase가 보내고, 링크를 누르면 이 사이트로 돌아와 새 비밀번호를 정한다)
$('#gForgot').addEventListener('click', async () => {

  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return gateMsg('위 칸에 가입한 이메일을 적고 다시 누르세요.', true);

    }
    gateMsg(`${email}로 재설정 메일을 보냈습니다. 메일에 적힌 인증 코드를 입력하세요. (가입한 주소가 아니면 메일이 가지 않습니다)`);

});
// 가입 이메일 인증: 메일의 숫자 코드를 넣으면 인증되고 바로 로그인된다. 코드가 안 왔으면 다시 보내기 (Supabase 기본 제한: 같은 주소 60초에 한 번)
function signupCodeDialog(email){
  const c = showModal(`<h2>📧 이메일 인증</h2><p class="muted">${esc(email)}로 보낸 인증 메일의 숫자 코드를 입력하세요. 메일이 안 보이면 스팸함도 확인하세요.</p>
    <input id="scode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="인증 코드" style="width:100%;margin:6px 0;letter-spacing:.2em">
    <p class="gate-msg" id="scMsg"></p>
    <div class="acts"><button class="btn" data-close>닫기</button><button class="btn" id="scAgain">다시 보내기</button><button class="btn solid" id="scGo">인증</button></div>`);
  const msg = t => { const m = $('#scMsg'); if (m) m.textContent = t; };
  $('#scGo').onclick = async () => {
    const code = $('#scode').value.replace(/\s/g, '');
    if (!/^\d{6,10}$/.test(code)) return msg('메일에 적힌 숫자 코드를 그대로 입력하세요.');
    $('#scGo').disabled = true; msg('확인하는 중입니다.');
    try {
      const {error} = await ACC.sb.auth.verifyOtp({email, token:code, type:'signup'});
      if (error) return msg(/expired|invalid/i.test(error.message) ? '코드가 틀렸거나 만료됐습니다. 다시 보내기를 눌러 새 코드를 받으세요.' : '인증하지 못했습니다: ' + error.message);
      c(); gateMsg(''); toast('이메일 인증을 마쳤습니다');   // 로그인은 onAuthStateChange가 이어서 처리한다
    } catch(e){ msg('인증하지 못했습니다: ' + errText(e)); }
    finally { const g = $('#scGo'); if (g) g.disabled = false; }
  };
  $('#scAgain').onclick = async () => {
    $('#scAgain').disabled = true;
    try {
      const {error} = await ACC.sb.auth.resend({type:'signup', email, options:{emailRedirectTo:location.origin + location.pathname}});
      msg(error ? (/security purposes|rate|seconds/i.test(error.message) ? '잠시 뒤에 다시 누르세요 (1분에 한 번).' : '보내지 못했습니다: ' + error.message) : '새 인증 메일을 보냈습니다.');
    } catch(e){ msg('보내지 못했습니다: ' + errText(e)); }
    finally { setTimeout(() => { const b = $('#scAgain'); if (b) b.disabled = false; }, 3000); }
  };
}
// 메일의 인증 코드로 재설정: 코드 확인 → 그 계정으로 로그인됨 → 새 비밀번호 저장
let PW_CODE_ON = false;
function pwCodeDialog(email){
  PW_CODE_ON = true;
  const c = showModal(`<h2>🔑 비밀번호 재설정</h2><p class="muted">${esc(email)}로 보낸 메일의 인증 코드와 새 비밀번호를 입력하세요. 메일이 안 보이면 스팸함도 확인하세요.</p>
    <input id="rcode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="인증 코드" style="width:100%;margin:6px 0;letter-spacing:.2em">
    <input id="rpw1" type="password" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password" style="width:100%;margin:6px 0">
    <input id="rpw2" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password" style="width:100%;margin:6px 0">
    <p class="gate-msg" id="rpwMsg"></p>
    <div class="acts"><button class="btn" data-close>닫기</button><button class="btn solid" id="rpwGo">바꾸기</button></div>`);
  $('#rpwGo').onclick = async () => {
    const code = $('#rcode').value.replace(/\s/g, ''), a = $('#rpw1').value, b = $('#rpw2').value, msg = $('#rpwMsg');
    if (!/^\d{6,10}$/.test(code)){ msg.textContent = '메일에 적힌 숫자 코드를 그대로 입력하세요.'; return; }
    if (a.length < 6){ msg.textContent = '새 비밀번호는 6자 이상으로 정하세요.'; return; }
    if (a !== b){ msg.textContent = '두 비밀번호 칸이 서로 다릅니다.'; return; }
    $('#rpwGo').disabled = true; msg.textContent = '확인하는 중입니다.';
    try {
      const v = await ACC.sb.auth.verifyOtp({email, token:code, type:'recovery'});
      if (v.error){ msg.textContent = /expired|invalid/i.test(v.error.message) ? '코드가 틀렸거나 만료됐습니다. 최근 메일의 코드인지 확인하세요.' : '확인하지 못했습니다: ' + v.error.message; return; }
      const {error} = await ACC.sb.auth.updateUser({password:a});
      if (error){ msg.textContent = '바꾸지 못했습니다: ' + error.message; return; }
      c(); toast('비밀번호를 바꿨습니다');
    } catch(e){ msg.textContent = '바꾸지 못했습니다: ' + errText(e); }
    finally { const g = $('#rpwGo'); if (g) g.disabled = false; setTimeout(() => { PW_CODE_ON = false; }, 3000); }
  };
}
